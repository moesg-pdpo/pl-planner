the next cycle of the Total Learning Plan."}, {"id": "p7.0", "part": "p7", "title": "Part 7 — Resources and Support", "text": "This part gives SSDs a quick reference to the key platforms, tools, and contacts that support the work covered in this playbook."}, {"id": "7.1", "part": "p7", "title": "Quick Reference: Key Platforms and Tools", "text": "Platform / Tool Description / What it is / What it does Access OPAL2.0 LNA data PD Plan module Course nominations Staff development records go.gov.sg/opal2 AskTGM Recommends professional learning opportunities for educators based on the A-R-C model, with reference to the TGM, EPMS, and the current year's Course Lists Supports planning of professional learning in areas of interest and need Facilitates competency-based developmental conversations Enables focused course discovery through conversational search go.gov.sg/asktgm Ask ELA (EAS Learning Assistant) To be l aunched in Q3 2026 Recommends EAS PL opportunities Guides EAS to reflect and apply their learning go.gov.sg/ask-ela Executive and Administrative Staff (EAS) Professional Learning Guide Helps EAS better understand their learning needs and goals, plan for meaningful learning activities, and reflect on their learning Supports EAS supervisors for PL conversations Offers pointers for the school/divisional PL team members to plan their EAS PL go.gov.sg/easplg SFEd Wiki (OPAL2.0) SFEd LoP descriptors for each AoP; Resource page for SSDs to plan school-wide and/or department PL aligned to SFEd priorities go.gov.sg/SFEd STP Wiki Knowledge Bases on Subject Matter and Goals, Students and Learning, and on Teaching Pedagogical Practices: Teaching Areas, Teaching Actions Lesson examples (videos and text-based) Professional Conversation Packages Professional Learning Modules on each of the 24 Teaching Areas go.gov.sg/stp STP AI Assistant Query the STP knowledge base for Teaching Actions, according to Teaching Areas, Teaching Actions and Learning Orientations, and lesson examples Design PL roadmap for teachers relating to T&L Design PLT conversation questions on T&L according to the STP Teaching Areas Design and audit lesson plans for DI, AI and ICT use, inclusive classroom, etc. go.gov.sg/stp-ai-assistant Design Principles Resources Full documentation of Design Principles 10 Focused Questions for enacting design principles in PL design go.gov.sg/designprinciples go.gov.sg/pdpo10dp LEARN Compendium Detailed indicators, guiding questions, and case studies for evaluating PL effectiveness across five dimensions Contact PDPO IM Chapter Wiki Resources, tools, and professional sharing for Instructional Mentors and Coordinating Instructional Mentors Accessible by trained IMs only https://go.gov.sg/instructional-mentoring-chapter Singapore Instructional Mentoring Wiki Information on Singapore Instructional Mentoring Approach (SIMA) Accessible by all teachers who want to learn more about SIMA https://go.gov.sg/sim-wiki-opal Professional Learning Community and Critical Inquiry A resource page about the Professional Learning Community (PLC) and the Critical Inquiry https://go.gov.sg/plcciwiki SSD Starter Guide to Staff Well-being Practical strategies and resources for SSDs to build and reinforce social-emotional strengths in staff — aligned to the four well-being strategies go.gov.sg/ssdstarterguide Toolkit for Staff Well-Being Champions Informs the use of well-being funds to enhance staff well-being with Schools and Divisional Staff Well-being Champs Supports School and Divisional Staff Well-being Champs with ideas for staff well-being programmes and promote workplace well-being go.gov.sg/swb-toolkit Strategic Planning Resources Strategic planning process, School Excellence Model and self-evaluation indicators by Centre of School Excellence, Schools Division go.gov.sg/cse-resources go.gov.sg/cse-pomd Promising Practices School-based examples of effective PL practices for reference and adaptation by Educational Leadership and School Excellence Branch, Schools Division go.gov.sg/elseb-pp"}, {"id": "7.2", "part": "p7", "title": "Who to Contact for Support", "text": "For questions about… Contact Planning, Implementing or Reviewing Professional Learning Experiences (including Total Learning Plan, Design Principles, LEARN Compendium, and Theory of Change) AST PDPO Team: moe_pdpo@moe.gov.sg Teacher Growth Model AST TGM Team: moe_tgm@moe.gov.sg SkillsFuture for Educators AST SFEd Secretariat: moe_sfed_secretariat@moe.gov.sg Singapore Teaching Practice, or subject-specific Pedagogical matters AST STP Team: moe_stp@moe.edu.sg Relevant Academy or Language Centre (AST, ELIS, PESTA, STAR, MLC, SCCL, PDTL) Professional Learning Community and Critical Inquiry (PLCCI) AST PLCCI Team: moe_plcci@moe.gov.sg Professional Learning for EAS AST EAS PD Unit: moe_ast_easpd@moe.gov.sg Instructional Mentoring AST Instructional Mentoring Team: mo e_ast_mtc@moe.edu.sg Staff Well-being AST Staff Well-being Team: moe_swb@moe.gov.sg Staff Counselling and Professional Support AST iCARE Team: moe_icare@moe.gov.sg AST PL Partners PL Partner North: MOE_PLpartner_North@moe.gov.sg PL Partner South: MOE_PLpartner_South@moe.gov.sg PL Partner East: MOE_PLpartner_East@moe.gov.sg PL Partner West: MOE_PLpartner_West@moe.gov.sg"}, {"id": "A", "part": "ap", "title": "Total Learning Plan (ToLP) Template", "text": "The ToLP translates your school's strategic initiatives into concrete, differentiated learning experiences. Use one row per strategic initiative. Review and update at mid-year (Term 2) and year-end (Term 4). Note: Each strategic initiative should be anchored to a TGM Learning Area or SFEd Area of Practice. Performance indicators are context-dependent and varies with the deployed strategies. Take reference to the Possible Outcome Measures Document in alignment to the dimensions of the LEARN compendium."}, {"id": "B", "part": "ap", "title": "Plan-Implement-Review Cycle: Expanded Map and Checklist", "text": "Expanded map: How the playbook supports the Plan- Implement -Review cycle PLAN — Set the Foundation PLAN ✓ Action Key tool / reference ☐ Met with School Leaders to understand strategic priorities and creative tensions before any programme design Part 2 .1; Part 2 .3 ☐ Reviewed school data: SEM reports, QSE findings, SSES, classroom evidence (e.g., open classroom insights, needs-based observation), and self-perception data of SFEd Level of Practice Part 2 .3 ☐ Facilitated the LNA and briefed ROs on developmental conversations Appendix E ☐ Conducted FGDs or staff conversations to understand what teachers find useful and what gets in the way Part 2 .3 ☐ Administered PLCDR baseline to understand where the school's collaborative culture currently sits Part 3 .5 ☐ Identified 2–3 creative tensions at the intersection of school strategy, teacher needs, and student outcomes Part 2 .3 ☐ Built Theory of Change with School Management Team and named the assumptions explicitly Part 5 .1; Appendix G ☐ Consulted Teacher Leaders as co-designers before finalising the ToLP Part 1 .1; Part 4 .1 ☐ Built ToLP with differentiated A-R-C learning experiences by staff segment and Practice Level Appendix A ; Part 3 .3 ☐ Applied Design Principles for Effective PL across all initiatives Part 3 .2 ☐ Set LEARN performance indicators for each initiative before implementation begins Part 5 .2; Appendix D ☐ Anchored each strategic initiative to the relevant TGM Learning Area and/or SFEd Area of Practice Part 1.3; Part 2.2 ☐ Briefed and obtained endorsement from School Leaders on the ToLP, confirming strategic alignment Part 2.2 IMPLEMENT — Build, Enact and Deepen IMPLEMENT ✓ Action Key tool / reference ☐ Built a guiding coalition of Teacher Leaders before whole-staff communication Part 4 .1 (Steps 1–2) ☐ Launched PLT structure (e.g., protected time timetabled, TLs briefed on facilitation, 3A protocol shared) Part 3 .5; Part 4 .2 ☐ Communicated the ToLP rationale to HODs and ROs Part 4.1 (Step 4) ☐ Addressed structural barriers proactively and raised with School Leaders with specific proposals Part 4 .1 (Step 5) ☐ Activated IM co-planning for identified teachers — CIM and IM pairings confirmed Part 3 .6 ☐ Monitored PLT quality through observation, co-facilitation, or structured review against the intent Part 3 .5; Part 4 . 2 ☐ Supported Teacher Leaders in deepening facilitation quality Part 3 .5; Part 4 .2 (3S Strategies) ☐ Conducted regular monitoring conversations with HODs on PLT progress and teacher application of learning Part 4 .1 (Step 7) ☐ Used SSES, lesson observation, and student data to monitor progress against LEARN indicators Part 5 .2 ☐ Generated and communicated early wins (e.g., shared observable evidence of progress) with staff and School Leaders Part 4 .1 (Step 6) ☐ Championed staff well-being through needs-based support and peer support structures Part 3 .7 REVIEW — Evaluate, Adjust, and Feed Forward REVIEW ✓ Action Key tool / reference ☐ Conducted mid-year LEARN review using guiding questions as the primary lens Part 5 .2; Appendix D ☐ Interpreted LEARN evidence across Enablers and Outcomes collectively Part 5 .2 ☐ Brought mid-year findings to School Leaders with a specific proposed adjustment Part 5 .2; Part 4 .1 (Step 7) ☐ Adjusted ToLP based on mid-year evidence, deepening or reworking existing initiatives Appendix A ☐ Updated the Theory of Change model where assumptions had shifted Part 5 . 1 ; Appendix G ☐ Conducted year-end LEARN review across Enablers and Outcomes collectively, and at both programme and school levels Part 5 .2; Appendix D ☐ Created a platform for teachers to share learning (e.g., Learning Festival, PLT showcase, or cluster sharing) Part 4 .1 (Step 8) ☐ Documented insights and revised the Theory of Change model, feeding findings back into next cycle's problems of practice Part 5 .1; Appendix G ☐ Presented year-end evidence to School Leaders as the starting point for next year's ToLP Part 5 .2; Part 2 .1 ☐ Began the next planning stage by revisiting strategic directions and preparing to administer LNA Part 2 .1; Part 2 .3"}, {"id": "C", "part": "ap", "title": "PL Session or Programme Design Template", "text": "Use this template when designing a school-based PL session or programme. Refer to Part 3 for guidance on SCALE, A-R-C, and Blended PL. Refer to Part 4 .2 for the 3A Reflection Approach and 3S Strategies. Design element Your notes Learning objective What will participants know, be able to do, or be disposed to do differently after this experience? Target audience Which staff segment? Current SFEd Level of Practice (where relevant)? Career stage? TGM Learning Area / SFEd AoP Which framework(s) does this PL address? STP Teaching Areas (if T&L focus) Which Teaching Areas are relevant to bring about the intended Learning Orientation(s)? A-R-C mode(s) Assignment / Relationship / Course — which will you use, and how will they be combined for coherence and transfer? Blended PL approach In-person, online synchronous, or asynchronous — and for which elements? Design Principles check Is the design Sustained, Collaborative, Aligned, Leverage-technology, Evidence-based? Reflection M echanism How are you Scaffolding, Stimulating, and Supporting teacher reflection within this experience? Role of Teacher Leaders How will TLs be involved in design, facilitation, or follow-through — not just attendance? Impact Evaluation P lan Which LEARN Enablers and Outcomes will you evaluate? What key review questions will you use? How will you collect evidence? Resources needed Time, venue, external facilitators, budget"}, {"id": "D", "part": "ap", "title": "LEARN Review Table", "text": "Use this table at mid-year and year-end reviews. For each dimension, use the key review questions as your primary evaluative lens — then draw on available evidence to answer them. Close with a collective insight that reads across the Enablers and Outcomes. ENABLERS Dimension Key Review Question Evidence Interpretation and Action E mpowering Educators [E] How does the school create opportunities for teachers to shape their professional growth in alignment with their interests and needs (e.g., through intentional assignments, support for teacher-initiated learning, incorporating teacher voice in school-wide PL)? How does the school provide the necessary conditions for teachers to engage effectively in PL (e.g., protected time, workload support, funding)? N urturing Networks [N] How does the school create opportunities for teachers to collaborate and share good practices? How does the school connect teachers with knowledgeable others to support their PL? OUTCOMES R esonance [R] To what extent do teachers find PL meaningful and relevant to their professional context and needs? To what extent has PL strengthened teachers' beliefs and perspectives about their professional practice? L earning [L] To what extent have teachers acquired or deepened their knowledge and/or skills through PL? A doption [A] To what extent have teachers translated their learning into changes in professional practice, and how sustained are these changes in professional practice over time? To what extent have these changes in professional practice contributed to improved student outcomes? Collective Insight Reading across Enablers and Outcomes: Are the conditions for professional learning strong enough, and are they producing meaningful resonance, learning and adoption? What should we continue, redesign, deepen or stop in the next ToLP cycle?"}, {"id": "E", "part": "ap", "title": "Guiding Prompts for Developmental Conversations", "text": "These prompts support Reporting Officers (ROs) and SSDs in conducting competency-based developmental conversations with reference to the TGM, SFEd, the STP, and TOTL principles. How to use these prompts These are not a script — they are a menu. Select 2–3 prompts most relevant to the purpose of the conversation (opening, mid-year check-in, or year-end review). The goal is to help the teacher articulate their own growth rather than to assess or direct them. For ROs: Use these in combination with the TGM, including the relevant Learning Area(s) and/or Practice Level descriptors for teachers’ professional learning plans. For SSDs: Use these when conducting your own developmental conversations with Teacher Leaders, or when coaching ROs on how to have these conversations For all: Always begin from a place of genuine curiosity — the prompts work best when the listener is truly interested in what the teacher has to say Opening the conversation Thinking about your teaching this year, what are you most proud of? What challenged you most? If you were to describe your role as a teacher right now using any of the five Roles of the Future-ready Teacher of the TGM, which Learning Area feels most alive and growing for you? What does your ideal learning year look like? What would you need to make that happen? Exploring learning needs Looking at the SFEd Areas of Practice, where do you see yourself currently? Where would you like to grow? What is one thing that, if you could do it more confidently in your classroom, would make the biggest difference to your students? Is there a colleague you have observed recently whose practice you admire? What specifically did you notice? Planning for growth What kind of learning experience would work best for you — a course, working alongside a colleague, or taking on a new challenge? What would success in practice look like for you by the end of this year in this TGM Learning Area? What support do you need from me, or from your RO, to make this growth possible? Reviewing progress (mid-year or end-of-year) Looking back at the learning goals you set, what progress have you made? What evidence do you have? Has your learning changed the way you approach your teaching? Can you give me a specific example? What do you want to carry forward into next year? What do you want to do differently?"}, {"id": "G", "part": "ap", "title": "Theory of Change Template", "text": "Use this template when building your school's Theory of Change for professional learning. Work through it with your SMT and Teacher Leaders before finalising the ToLP — not after. The Theory of Change is not a document to complete; it is a thinking discipline to work through. Refer to Part 5 .1 for guidance on how to build and use the Theory of Change. Stage The question this stage must answer Your School Notes Key Problems of Practice What is the specific problem of practice our PL strategy is responding to? Assumptions (1) What must be true in our school before our strategies can take effect? Strategies What will we do — and how do the learning experiences we design address the problem? Assumptions (2) What must be true for our strategies to lead to the outcomes we intend, not just participation? Outcomes What changes do we expect to see, and when? Assumptions (3) What must hold for outcomes to become lasting change? Impact If we succeed, what kind of school — and what kind of people — will we have built? Feedback loop What did we learn from this cycle that changes how we understand the problem — and what does that mean for next year's ToLP? Building teachers' capabilities and confidence is building your school's greatest asset: its people. Through thoughtful planning, deliberate design, steady implementation, and honest review, you create the conditions for sustained educational excellence — not just for this year, but for the teachers and students who will come after. \"The teachers we need in 2035 are already here in our schools. The key is to continue to nurture their expertise while addressing the challenges that surface in a rapidly changing world. By retaining good teachers, we are essentially cultivating the master educators who will define Singapore's educational excellence for decades.\" — Director-General of Education Liew Wei Li, The Straits Times, January 2026"}];

/* =====================================================================
   BUILD — one page, as in the original builder.
   The numbered layers are the planning cascade. Three unnumbered
   sections sit around it rather than in the chain:
   ◌ Current context & creative tensions — a stocktake you revisit
   ◇ Theory of Change — why the plan should work (before the ToLP is final)
   ↻ Review & feed forward — mid-year and year-end
   ===================================================================== */
function TA(p,ph="",cls=""){ return `<textarea class="inp ${cls}" data-b="${p}" rows="1" placeholder="${esc(ph)}">${esc(get(p))}</textarea>`; }
function IN(p,ph="",extra=""){ return `<input class="inp" data-b="${p}" value="${esc(get(p))}" placeholder="${esc(ph)}" ${extra}>`; }
function SEL(p,opts,extra=""){ const v=get(p)||""; return `<select class="inp" data-b="${p}" data-rr ${extra}>${opts.map(([k,l])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`; }
function lk(k,cls=""){ const d=LMAP[k]; return `<span class="lk ${cls}" style="background:${d.color}" title="${esc(d.name)}">${k}</span>`; }
function statusPill(s){ if(!s) return ""; const o=ASTATUS.find(x=>x.k===s); return `<span class="status ${s}"><i></i>${esc(o?o.label:s)}</span>`; }
function tsPill(k){ const t=TSMAP[k]||TSMAP.addressing; return `<span class="tspill" style="--c:${t.c};--bg:${t.bg}">${t.label}</span>`; }

/* ---------------- render shell ---------------- */
function render(keepScroll){
  const y=window.scrollY;
  syncTolp(); syncTensions();
  document.body.classList.toggle("m-view",ui.mode==="view"); document.body.classList.toggle("m-build",ui.mode!=="view");
  $("#schoolName").value=state.meta.schoolName; $("#planYear").value=state.meta.year;
  $$("#modeSeg [data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===ui.mode));
  renderRail();
  const v=$("#view");
  v.innerHTML=ui.mode==="view"?viewMode():buildMode();
  $$("textarea.inp",v).forEach(autoGrow);
  if(ui.mode==="view"&&ui.lens==="toc") mountTocPreview();
  if(keepScroll) window.scrollTo(0,y);
  setTimeout(watchLayers,0);
}
function layerDone(id){
  const inits=allInits(), ex=allExps(), A=allAssumptions();
  const R=(a,b)=>b?"done":a?"started":"todo";
  const T={
    L1:[has(state.top.vision)||has(state.top.mission), has(state.top.vision)&&has(state.top.mission)&&has(state.top.values)],
    CTX:[has(state.context.evidence)||state.tensions.length, has(state.context.evidence)&&state.tensions.some(t=>inPlay(t.status)&&has(t.aim)&&has(t.currently)&&has(t.resulting))],
    L2:[state.thrusts.length, state.thrusts.length&&state.thrusts.every(t=>has(t.title))&&state.thrusts.some(t=>t.staffDev)],
    L3:[state.objectives.length, inits.length&&inits.every(x=>x.sn&&x.init.tensionIds.length&&has(x.init.anchorArea))],
    L4:[LEARN.some(d=>has(state.learn[d.k])), LEARN.every(d=>has(state.learn[d.k])&&has(state.learnRev[d.k].target))],
    TOC:[A.length||HZ.some(h=>state.toc.outcomes[h.k].length), ["a1","a2","a3"].every(s=>state.toc[s].length)&&HZ.every(h=>state.toc.outcomes[h.k].length)&&(has(state.toc.impact.headline)||has(state.toc.impact.points))],
    L5:[ex.length, inits.length&&inits.filter(({o,init})=>!(isLaterObj(o)&&!exps(init.id).length)).every(({init})=>exps(init.id).length)],
    REV:[LEARN.some(d=>has(state.learnRev[d.k].midEv)||has(state.learnRev[d.k].endEv)), LEARN.every(d=>has(state.learnRev[d.k].endEv))&&has(state.toc.feedback.end)]
  }[id]||[0,0];
  return R(T[0],T[1]);
}
function renderRail(){
  if(ui.mode==="view"){
    $("#side").innerHTML=`<div class="rhead"><b>View</b><small>See the plan through each lens</small></div><ol class="rlist">${LENSES.map(l=>`<li><button class="ritem ${ui.lens===l.id?"on":""}" data-lens="${l.id}" style="--accent:${l.c}"><span class="rdot">${l.n}</span><span class="rt">${l.name}<small class="rsm">${l.sub}</small></span></button></li>`).join("")}</ol>
      <p class="railnote">Everything here is drawn from what you write in Build. Each view prints as its own document.</p><button class="tbtn" data-mode="build" style="margin-top:6px">← Back to Build</button>`;
  } else {
    $("#side").innerHTML=`<div class="rhead"><b>Build</b><small>Plan · Implement · Review</small></div><ol class="rlist">${SECS.map(s=>{ const st=layerDone(s.id); return `<li><button class="ritem ${st} ${s.ring?"ring":""} ${ui.active===s.id?"on":""}" data-scrollto="${s.id}" data-rid="${s.id}" style="--accent:${s.acc}"><span class="rdot">${st==="done"?"✓":s.n}</span><span class="rt">${s.short}</span></button></li>`; }).join("")}</ol>
      <p class="railnote"><b>1–5</b> form the planning cascade; each feeds the next. <b>◌</b> the current context, <b>ToC</b> and <b>↻</b> review sit around it — you return to them through the year.</p>`;
  }
  const mob=$("#mobStep"); if(mob) mob.innerHTML=ui.mode==="view"?`<select class="inp" data-navlens aria-label="Lens">${LENSES.map(l=>`<option value="${l.id}" ${ui.lens===l.id?"selected":""}>${l.name}</option>`).join("")}</select>`:`<select class="inp" data-navsec aria-label="Go to section">${SECS.map(s=>`<option value="${s.id}" ${ui.active===s.id?"selected":""}>${/^\d/.test(s.n)?"Layer "+s.n+" · ":""}${s.short}</option>`).join("")}</select>`;
}
let _spy=null;
function watchLayers(){
  if(_spy){ _spy.disconnect(); _spy=null; }
  if(ui.mode!=="build"||!("IntersectionObserver" in window)) return;
  _spy=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ ui.active=e.target.id; $$("#side .ritem").forEach(b=>b.classList.toggle("on",b.dataset.rid===ui.active)); } }),{rootMargin:"-25% 0px -65% 0px"});
  $$("#view section.layer").forEach(s=>_spy.observe(s));
}
function section(S,body){
  return `<section class="layer ${S.ring?"ringsec":""}" id="${S.id}" style="--accent:${S.acc};--accent-bg:${S.bg}">
    <header><span class="step">${/^\d/.test(S.n)?"Layer "+S.n:S.id==="CTX"?"◌ Stocktake":S.id==="TOC"?"Theory of Change":"↻ Review"}</span><h2>${S.title}</h2><span class="spacer"></span><span class="lchips">${S.lens.map(lensChip).join("")}</span></header>
    <div class="lmeta"><span class="ref">Playbook ${S.ref}</span><button class="shows" data-lensgo="${{L1:"strategic",CTX:"strategic",L2:"strategic",L3:"strategic",L4:"learn",TOC:"toc",L5:"tactical",REV:"learn"}[S.id]}">See it in View →</button></div>
    <p class="lead">${S.lead}</p>${body}${layerChecks(S.id)}</section>`;
}
function layerChecks(id){
  const open=runChecks().filter(c=>c.layer===id&&!c.ok);
  if(!open.length) return "";
  return `<details class="lchk"><summary><span class="sev ${open.some(c=>c.level==="gap")?"gap":"tip"}"></span>${open.length} thing${open.length===1?"":"s"} to look at here</summary><ul>${open.map(c=>`<li><span class="sev ${c.level}"></span>${esc(c.msg)}</li>`).join("")}</ul></details>`;
}

  h+=sub("d","How have the creative tensions shifted?","Note how each tension has shifted and update its status — still Addressing, Resolved, or an Emerging one now ready to address. If the problem now looks different, rewrite its stem. New tensions surfaced during implementation can be added to the current context.");

/* ---------------- coherence checks (tagged by section) ---------------- */
function runChecks(){
  const C=[]; const add=(ok,layer,level,msg)=>C.push({ok:!!ok,layer,level,msg});
  const inits=allInits();
  add(has(state.top.vision)||has(state.top.mission),"L1","gap","State the school’s Vision and Mission — your Theory of Change frames Impact against them.");
  add(has(state.context.evidence),"CTX","gap","Record the evidence your tensions are grounded in.");
  add(state.tensions.some(t=>inPlay(t.status)),"CTX","gap","No creative tension is being addressed — set the status of those this cycle addresses to Addressing.");
  state.tensions.forEach(t=>{
    add(has(t.aim)&&has(t.currently)&&has(t.resulting),"CTX","gap",`${tNo(t.id)}: complete all three parts of the stem (we aim to… but currently… resulting in…).`);
    if(inPlay(t.status)) add(inits.some(x=>x.init.tensionIds.includes(t.id)),"L3","gap",`${tNo(t.id)}${t.tag?` (${t.tag})`:""} is in play, but no initiative addresses it.`);
  });
  add(state.thrusts.length,"L2","gap","Add the school’s Strategic Thrusts (at least the staff-development thrust).");
  add(!state.thrusts.length||state.thrusts.some(t=>t.staffDev),"L2","gap","Tick which thrust is the staff-development thrust — your PL objectives hang from it.");
  state.objectives.forEach((o,i)=>{ const t=state.thrusts.find(x=>x.id===o.thrustId); if(t&&state.thrusts.some(x=>x.staffDev)) add(t.staffDev,"L3","tip",`Objective ${i+1} hangs from “${trunc(t.title,40)}”, which is not marked as a staff-development thrust.`); });
  add(state.objectives.length,"L3","gap","Add at least one PL Strategic Objective.");
  state.objectives.forEach((o,i)=>add(o.thrustId,"L3","gap",`Objective ${i+1} is not linked to a Strategic Thrust, so it cannot be numbered.`));
  inits.forEach(({init,sn})=>{
    add(init.tensionIds.length,"L3","tip",`SI ${sn||"–"}: link it to the creative tension(s) it addresses.`);
    add(has(init.anchorArea),"L3","tip",`SI ${sn||"–"}: anchor it on a TGM Learning Area or SFEd Area of Practice.`);
  });
  const noKpi=LEARN.filter(d=>!has(state.learn[d.k]));
  add(!noKpi.length,"L4","gap",`Set a school-level KPI for ${noKpi.map(d=>d.name).join(", ")||"each dimension"}.`);
  add(LEARN.every(d=>has(state.learnRev[d.k].target)),"L4","tip","Set a baseline and target for each school-level KPI.");
  add(tocProblems().length,"TOC","gap","No problems of practice yet — they come from the creative tensions in play.");
  ["a1","a2","a3"].forEach((s,si)=>{
    add(state.toc[s].length,"TOC","gap",`Name at least one assumption at ${TOC[s].name}.`);
    state.toc[s].forEach((a,i)=>add(has(a.owner),"TOC","tip",`A${si+1}.${i+1}: give this assumption an owner.`));
  });
  HZ.forEach(h=>add(state.toc.outcomes[h.k].length,"TOC","gap",`Add ${h.name.toLowerCase()} outcomes.`));
  add(has(state.toc.impact.headline)||has(state.toc.impact.points),"TOC","gap","Articulate the Impact, framed against your VMV.");
  inits.forEach(({o,init,sn})=>{
    const ex=exps(init.id);
    if(isLaterObj(o)&&!ex.length) return;
    add(ex.length,"L5","gap",`SI ${sn||"–"} has no learning experiences yet.`);
    if(ex.length>1){ const modes=new Set(ex.flatMap(x=>x.arc)); add(modes.size>1,"L5","tip",`SI ${sn||"–"} relies on one A-R-C mode — combine complementary modes so learning sticks.`); }
    ex.forEach((x,i)=>{ const lab=`SI ${sn||"–"} · LE${i+1}`;
      add(x.arc.length,"L5","gap",`${lab}: tag the A-R-C mode(s).`);
      add(has(x.staffSegment),"L5","tip",`${lab}: name the staff segment it is designed for.`);
      add(has(x.reflection),"L5","tip",`${lab}: plan application, reflection and follow-through.`);
    });
  });
  const m=ui.rev==="end"?"end":"mid";
  if(LEARN.some(d=>has(state.learnRev[d.k][m+"Ev"]))){
    LEARN.forEach(d=>add(has(state.learnRev[d.k][m+"Ev"]),"REV","gap",`Record ${m==="mid"?"mid-year":"year-end"} evidence for ${d.name}.`));
    add(has(state.insight[m]),"REV","gap","Write the collective insight.");
    const A=allAssumptions(); if(A.length) add(A.every(x=>x.a[m].status),"REV","tip","Judge each assumption.");
    if(A.some(x=>x.a[m].status==="broke")) add(has(state.toc.feedback[m]),"REV","gap","An assumption broke down — record what it changes in the feedback loop.");
  }
  return C;
}

/* ---------- progress, per model item: a status dot and one short fact ----------
   The cycle view is the zoomed-out picture, so it shows where each part stands,
   not the school's prose (that lives one click away, in each lens). */
const PST={done:["p-done","Done"],part:["p-part","In progress"],none:["p-none","Not started"]};
const pline=(st,fact)=>`<span class="ms"><i class="pd ${PST[st][0]}" title="${PST[st][1]}" aria-label="${PST[st][1]}"></i>${fact}</span>`;
const lvl=(n,of)=>!n?"none":(of==null||n>=of)?"done":"part";
const pl=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const termRange=t=>!t.length?"":t.length===1?`Term ${t[0]}`:t.every((x,i)=>!i||x===t[i-1]+1)?`Terms ${t[0]}–${t[t.length-1]}`:`Terms ${t.join(", ")}`;
function summ(key){
  const st=state, inits=allInits(), ex=allExps(), play=st.tensions.filter(t=>inPlay(t.status));
  const ev=lines(st.context.evidence), needs=lines(st.context.needs), cnt=(arr,f)=>arr.filter(f).length, E=ex.length;
  switch(key){
    case "vmv": { const n=[st.top.vision,st.top.mission,st.top.values].filter(has).length; return pline(lvl(n,3),n?`${n} of 3 statements${st.top.extras.length?` + ${st.top.extras.length} more`:""}`:"Not yet stated"); }
    case "ctx": return pline(ev.length&&play.length?"done":ev.length||st.tensions.length?"part":"none",`${pl(ev.length,"evidence source")} · ${play.length} being addressed`);
    case "needs": return pline(lvl(needs.length),needs.length?pl(needs.length,"need")+" named":"Not yet identified");
    case "thr": { const sd=sdThrusts(), so=st.objectives.filter(o=>sd.some(t=>t.id===o.thrustId)); return pline(sd.length&&so.length?"done":st.thrusts.length?"part":"none",sd.length?`${pl(sd.length,"staff development thrust")} · ${pl(so.length,"objective")}`:"Staff development thrust not yet set"); }
    case "si": { const ok=cnt(inits,x=>has(x.init.anchorArea)&&x.init.tensionIds.length); return pline(lvl(ok,inits.length||1),inits.length?`${pl(inits.length,"initiative")}${ok<inits.length?` · ${inits.length-ok} to anchor or link`:" · anchored and linked"}`:"None yet"); }
    case "port": return pline(lvl(E),E?`${pl(E,"experience")} · A ${cnt(ex,e=>e.x.arc.includes("A"))} · R ${cnt(ex,e=>e.x.arc.includes("R"))} · C ${cnt(ex,e=>e.x.arc.includes("C"))}`:"None yet");
    case "seg": { const n=cnt(ex,e=>has(e.x.staffSegment)&&e.x.terms.length&&has(e.x.resources)), t=[1,2,3,4].filter(t=>ex.some(e=>e.x.terms.includes(t))); return pline(lvl(n,E||1),E?`${n} of ${E} segmented, timed and resourced${t.length?" · "+termRange(t):""}`:"—"); }
    case "ind": { const k=LEARN.filter(d=>has(st.learn[d.k])).length; return pline(lvl(k,5),k?`School KPIs set for ${k} of 5 LEARN dimensions`:"No KPIs yet"); }
    case "design": { const n=cnt(ex,e=>e.x.arc.length&&e.x.scale.length&&has(e.x.description)); return pline(lvl(n,E||1),E?`${n} of ${E} designed`:"—"); }
    case "diff": { const n=new Set(ex.map(e=>e.x.staffSegment.trim().toLowerCase()).filter(Boolean)).size; return pline(lvl(n),n?pl(n,"staff segment")+" served":"No segments named"); }
    case "struct": { const u=STRUCTS.filter(s=>ex.some(e=>e.x.structs.includes(s))).map(s=>s.split(" (")[0]); return pline(lvl(u.length),u.length?u.slice(0,3).join(" · ")+(u.length>3?` +${u.length-3}`:""):"None tagged"); }
    case "refl": { const n=cnt(ex,e=>has(e.x.reflection)); return pline(lvl(n,E||1),E?`${n} of ${E} planned`:"—"); }
    case "cond": { const u=CONDS.filter(c=>ex.some(e=>e.x.conds.includes(c.k))), n=cnt(ex,e=>e.x.conds.length||has(e.x.cond)||e.x.assumpIds.length); return pline(lvl(n,E||1),u.length?u.slice(0,3).map(c=>c.label.split(" &")[0]).join(" · ")+(u.length>3?` +${u.length-3}`:""):(n?"Planned":"Not yet planned")); }
  }
  return "";
}
function tocCell(k){
  const st=state, inits=allInits();
  if(k==="prob"){ const p=tocProblems(); return pline(lvl(p.length),p.length?p.map(t=>`<b>${tNo(t.id)}</b>`).join(" "):"None yet"); }
  if(k==="strat") return pline(lvl(inits.length),inits.length?pl(inits.length,"initiative"):"None yet");
  if(k==="out"){ const n=HZ.map(h=>st.toc.outcomes[h.k].length); return pline(n.every(Boolean)?"done":n.some(Boolean)?"part":"none",n.some(Boolean)?`Short ${n[0]} · Med ${n[1]} · Long ${n[2]}`:"None yet"); }
  if(k==="imp") return pline(has(st.toc.impact.headline)?"done":"none",has(st.toc.impact.headline)?"Stated":"Not yet stated");
  const A=st.toc[k]; if(!A.length) return pline("none","None yet");
  const S=A.map(latestStatus), risk=S.filter(x=>x==="risk"||x==="broke").length, hold=S.filter(x=>x==="holding").length;
  return pline("done",`${A.length} named${hold||risk?` · ${hold} holding${risk?` · <b class="sm-risk">${risk} at risk</b>`:""}`:""}`);
}

const KBI=Object.fromEntries(KB.map(k=>[k.id,k]));
const STOP=new Set("this that with from have what when where which would could should about their there they them then than also just want need help school professional learning teachers teacher staff will into your ours more each other".split(" "));
function kbTokens(t){ return [...new Set((t||"").toLowerCase().match(/[a-z0-9-]{4,}/g)||[])].filter(x=>!STOP.has(x)); }
function kbRetrieve(query,must=[],limit=5){
  const toks=kbTokens(query);
  const scored=KB.map(s=>{ const hay=(s.title+" "+s.text).toLowerCase(); let sc=0; toks.forEach(t=>{ if(s.title.toLowerCase().includes(t)) sc+=6; sc+=Math.min(hay.split(t).length-1,6); }); return {s,sc}; }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).map(x=>x.s);
  const picked=[...must.map(id=>KBI[id]).filter(Boolean)];
  scored.forEach(s=>{ if(picked.length<limit&&!picked.includes(s)) picked.push(s); });
  return picked.slice(0,limit).map(s=>({id:s.id,part:s.part,title:s.title,source:"PL Playbook",url:CONFIG.PLAYBOOK_URL+"#sec-"+s.id,content:s.text.slice(0,limit>5?3500:4500)}));
}

  if(["mid","end"].includes(st.meta.stage)){ const m=st.meta.stage, R=LEARN.filter(d=>has(st.learnRev[d.k][m+"Ev"])); if(R.length) L.push(`${STAGE_NAME[m].toUpperCase()} EVIDENCE:\n`+R.map(d=>`- ${d.k}: ${T(st.learnRev[d.k][m+"Ev"],140)}`).join("\n")); }
  let out=L.join("\n\n"); if(out.length>max) out=out.slice(0,max-1)+"…";
