    ask:m=>m==="check"?"Check this PL Strategic Objective: does it name the competency to develop, connect to the tensions, and give initiatives something specific to anchor on?":m==="improve"?"Sharpen this PL Strategic Objective. Keep the intent.":"Draft a PL Strategic Objective: one sentence starting with a verb (Strengthen, Develop, Build…) that names the competency or practice to grow and connects to the tensions.",
    fmt:m=>`${OPTS(3)} In each option write:\nSTATEMENT:\n${WHY}`,
    apply:(o,a)=>{ const L=parseLabels(o); set(`objectives#${a}.description`,L.STATEMENT||clean(o)); return "Inserted."; }},
  si:{label:()=>"Strategic initiative",must:["2.2"],
    guide:()=>["What will the initiative do — and which practice will it build?","Which TGM Learning Area or SFEd Area of Practice anchors it? (The AskTGM chatbot and SFEd bot, linked under the anchor, can recommend one.)","Which creative tension does it address?"],
    ctx:a=>{ const f=findInit(a); return `PL STRATEGIC OBJECTIVE (SO ${objNumber(f.o)||"–"}): ${f.o.description||"(empty)"}\nCURRENT ANCHOR: ${anchorTxt(f.init)||"(none)"}\nTENSIONS:\n${(f.init.tensionIds.length?f.init.tensionIds.map(id=>state.tensions.find(t=>t.id===id)).filter(Boolean).map(tStem).join("\n"):playStems())}`; },
    val:a=>findInit(a).init.title,
    ask:m=>m==="check"?"Check this strategic initiative: is it specific about what it does and the practice it builds, coherent with its objective, and anchored on the right Learning Area or Area of Practice?":`Draft a strategic initiative title, anchored on exactly one TGM Learning Area (${TGM_LA.flatMap(g=>g.items).join("; ")}) or SFEd Area of Practice (${SFED_AOP.join("; ")}).`,
    fmt:m=>`${OPTS(3)} In each option write:\nTITLE:\nANCHOR: (TGM: <Learning Area> or SFEd: <Area of Practice>, copied exactly)\n${WHY}`,
    apply:(o,a)=>{ const L=parseLabels(o), f=findInit(a), P=`objectives#${f.o.id}.initiatives#${a}`; set(P+".title",L.TITLE||clean(o)); const raw=L.ANCHOR||"", mm=raw.match(/^\s*(TGM|SFEd)\b[^:]*:\s*(.*)$/i), pref=mm?mm[1].toLowerCase():"", an=(mm?mm[2]:raw).trim().toLowerCase(); const tg=TGM_LA.flatMap(g=>g.items).find(x=>x.toLowerCase()===an), sf=SFED_AOP.find(x=>x.toLowerCase()===an); if(sf&&(pref==="sfed"||!tg)){ set(P+".anchorType","SFEd"); set(P+".anchorArea",sf); } else if(tg){ set(P+".anchorType","TGM"); set(P+".anchorArea",tg); } return "Inserted — check the anchor."; }},
  kpi:{label:a=>`School-level KPI · ${LMAP[a].name}`,must:["5.2"],list:true,path:a=>`learn.${a}`,
    guide:a=>[...LMAP[a].qs,"What data will you have at year-end — and what at mid-year?"],
    ctx:a=>`LEARN DIMENSION: ${LMAP[a].name} (${LMAP[a].type}) — ${LMAP[a].short}\nCURRENT KPI(S): ${state.learn[a]||"(none)"}\n\nPL STRATEGIC OBJECTIVES:\n${state.objectives.map(o=>`SO ${objNumber(o)||"–"}: ${o.description}`).join("\n")||"(none)"}`,
    ask:(m,a)=>`Suggest school-level KPIs for ${LMAP[a].name} that would show whether the PL Strategic Objectives are being achieved. They sit at the objective layer, above programme-level indicators. Make them measurable and go beyond satisfaction where the dimension allows; mix quantitative and qualitative evidence; use data the school realistically has or can collect (e.g. lesson observation, artefacts and pupil work, PLT records, SFEd Level of Practice, LNA, short pulse surveys, FGDs, SEM/QSE/SSES/PLCDR). SSES, QSE and PLCDR are annual or biennial — fine for year-end, not mid-year, so pair each KPI with a signal the school can read at mid-year.`,
    fmt:m=>`${OPTS(3)} In each option write:\nKPI:\nTARGET: (with [placeholder] numbers)\nSOURCE: (instrument and when it is available)\nMID-YEAR SIGNAL: (what to look at in Term 2)\n${WHY}`,
    apply:(o,a,how)=>{ const L=parseLabels(o); putText(`learn.${a}`,(L.KPI||clean(o))+(has(L["MID-YEAR SIGNAL"])?`\nMid-year signal: ${L["MID-YEAR SIGNAL"]}`:""),how); const r=state.learnRev[a]; if(!has(r.baseline)&&L.SOURCE) r.baseline=`[baseline] — ${L.SOURCE}`; if(!has(r.target)&&has(L.TARGET)) r.target=L.TARGET; return "Inserted — add the baseline from your data."; }},
  assume:{label:a=>TOC[a].name,must:["5.1","G"],items:true,
    guide:a=>[TOC[a].q,TOC[a].eg+".","Who in the school would make each one true?"],
    ctx:a=>`PROBLEMS OF PRACTICE:\n${tocProblems().map(tStem).join("\n")||"(none)"}\n\nSTRATEGIES:\n${allInits().map(({init,sn})=>`SI ${sn||"–"}: ${init.title}\n${exps(init.id).map(leLine).join("\n")}`).join("\n")||"(none)"}\n\nALREADY NAMED HERE:\n${state.toc[a].map(x=>"- "+x.text).join("\n")||"(none)"}`,
    ask:(m,a)=>m==="check"?`Check these assumptions at "${TOC[a].name}": are they conditions someone can make true (not restatements of the strategy), specific to this plan, and owned?`:`Suggest assumptions for "${TOC[a].name}": ${TOC[a].q} Each names an enabling condition specific to these strategies that someone can make true. Suggest an owner by role.`,
    fmt:m=>m==="check"?CHECK:`List 4, one per line, exactly:\n- ASSUMPTION: <text> | OWNER: <role(s)>`,
    item:(it,a)=>{ const x=F.assumption(); x.text=it.ASSUMPTION||it._raw; x.owner=it.OWNER||""; state.toc[a].push(x); return "Added."; }},
  outcomes:{label:()=>"Outcomes",must:["5.1","5.2"],items:true,
    guide:()=>["What would teachers be doing differently within months?","What would be consistent across the school within a year or two?","What would a sustained PL culture look like?"],
    ctx:()=>`PROBLEMS:\n${tocProblems().map(tStem).join("\n")||"(none)"}\n\nSTRATEGIES:\n${allInits().map(({init,sn})=>`SI ${sn||"–"}: ${init.title}`).join("\n")||"(none)"}\n\nALREADY NAMED:\n${HZ.map(h=>`${h.name}: ${state.toc.outcomes[h.k].map(o=>o.text).join("; ")||"—"}`).join("\n")}`,
    ask:m=>m==="check"?"Check these outcomes: do they build from short to long term, describe change rather than activity, and name the LEARN evidence that would show them?":"Suggest outcomes across three horizons (short, medium, long term), each tagged with the LEARN dimension(s) that would evidence it: E, N, R, L, A.",
    fmt:m=>m==="check"?CHECK:`List 6 (2 per horizon), one per line, exactly:\n- HORIZON: short|medium|long | OUTCOME: <text> | LEARN: <letters>`,
    item:(it)=>{ const hz=/med/i.test(it.HORIZON)?"medium":/long/i.test(it.HORIZON)?"long":"short"; const x=F.outcome(); x.text=it.OUTCOME||it._raw; x.learn=learnLetters(it.LEARN); state.toc.outcomes[hz].push(x); return "Added."; }},
  impact:{label:()=>"Impact",must:["5.1"],
    guide:()=>["If you succeed, what kind of school will you have built?","What will be different for students, for teachers, for the community?"],
    ctx:()=>`SCHOOL DIRECTION:\n${vmvLine()}\n\nLONG-TERM OUTCOMES: ${state.toc.outcomes.long.map(o=>o.text).join("; ")||"(none)"}`,
    val:()=>state.toc.impact.headline,
    ask:m=>m==="check"?"Check this impact statement: is it aligned to the VMV and in the school's own voice rather than generic outcome language?":"Draft the Impact for the Theory of Change, aligned to the VMV and in the school's own voice.",
    fmt:m=>`${OPTS(2)} In each option write:\nHEADLINE: (one sentence)\nPOINTS: (three lines starting "- ": students, teachers, community)`,
    apply:(o)=>{ const L=parseLabels(o); set("toc.impact.headline",L.HEADLINE||clean(o)); const pts=listText(L.POINTS||""); if(pts) set("toc.impact.points",pts); return "Inserted."; }},
  le:{label:a=>"Learning experience design",must:["3.2","3.3","3.5"],
    guide:()=>["Who is it for, and what should they be able to do differently in class?","How will Assignments, Relationships and Courses combine so the learning sticks?","Where will teachers collaborate, try things out and reflect — and who follows up?","What role will Teacher Leaders play?"],
    tenq:true,
    ctx:a=>{ const e=findExp(a); return `PL STRATEGIC OBJECTIVE: ${e.o.description}\n${leFull(e)}\n\nTHEORY OF CHANGE ASSUMPTIONS:\n${allAssumptions().map(x=>`${x.code}: ${x.a.text}`).join("\n")||"(none)"}\n\nSTAFF CAPABILITY NEEDS:\n${state.context.needs||"(none)"}`; },
    val:a=>findExp(a).x.title,
    ask:m=>m==="check"?`Test this learning experience against the 10 Questions for Design of Effective PL Experiences below. Go question by question, but only comment where the design is weak or silent — be specific about what to add or change, and keep what works. Also say whether the A-R-C modes combine with the initiative's other experiences so learning is sustained and transfers.\n\nTHE 10 QUESTIONS:\n${TENQ_TXT}`:`${m==="improve"?"Improve this learning experience, keeping what the school has written where it is sound.":"Design this learning experience from the SSD's notes and the plan."} Purposeful design, not an event: combine complementary A-R-C modes so learning is sustained and transfers to the classroom; build in the Design Principles; differentiate by staff segment; plan for application, reflection (Scaffold, Stimulate, Support) and follow-through; give Teacher Leaders a real role in design, facilitation or follow-through; and choose collaborative structures (PLTs, mentoring, open classrooms, lesson study, TTT…) that grow a learning community. Think the design through with the 10 Questions:\n${TENQ_TXT}\nMake the two options genuinely different designs (e.g. different A-R-C combinations or structures), each workable within a school's time and people constraints.`,
    fmt:m=>m==="check"?`Use headings "What already works", "What the 10 Questions surface" (bullets naming the question number, e.g. "- Q2 Ownership: …"), and "Two changes to make first". Bullet lines start "- ". Under 260 words. Do not rewrite the whole experience.`:`${OPTS(2)} In each option write exactly these labelled lines:\nTITLE:\nARC: (e.g. A+R)\nPRINCIPLES:\nDETAILS: (3–4 lines starting "- ")\nSEGMENT:\nRESOURCES:\nTERMS: (e.g. 1,2)\nSTRUCTURES: (from: ${STRUCTS.join(", ")})\nREFLECTION:\nCONDITIONS: (the two or three that matter most, from: ${CONDS.map(c=>c.label).join(", ")})\nPUT IN PLACE: (one line per condition starting "- ")\nIND-L:\nIND-E:\nIND-A:\nIND-R:\nIND-N: (programme-level evidence is optional — fill only the one or two dimensions this experience will genuinely inform, preferably from what it already produces; leave the rest blank)\nDESIGN NOTES: (2–3 lines starting "- " showing how the design answers the 10 Questions it relies on most, citing them as Q1–Q10)`,
    apply:(o,a)=>{ const L=parseLabels(o), x=findExp(a).x; if(L.TITLE) x.title=L.TITLE; const arc=[...new Set(((L.ARC||"").toUpperCase().match(/\b[ARC]\b/g)||[]))]; if(arc.length) x.arc=arc; const sc=SCALE.filter(s=>new RegExp(s.name.split(" ")[0],"i").test(L.PRINCIPLES||"")).map(s=>s.id); if(sc.length) x.scale=sc; if(L.DETAILS) x.description=listText(L.DETAILS); if(L.SEGMENT) x.staffSegment=L.SEGMENT; if(L.RESOURCES) x.resources=L.RESOURCES; const tm=[...new Set(((L.TERMS||"").match(/[1-4]/g)||[]).map(Number))].sort(); if(tm.length) x.terms=tm; const stt=structsIn(L.STRUCTURES); if(stt.length) x.structs=stt; if(L.REFLECTION) x.reflection=L.REFLECTION; const cd=condsIn(L.CONDITIONS); if(cd.length) x.conds=cd; if(L["PUT IN PLACE"]) x.cond=listText(L["PUT IN PLACE"]); else if(L["TL ROLE"]) x.cond=L["TL ROLE"]; ["L","E","A","R","N"].forEach(k=>{ const v=L["IND-"+k]; if(has(v)&&!/^(n\/?a|none|-)$/i.test(v.trim())) x.ind[k]=listText(v); }); ui.opsOpen[x.id]=true; return "Design inserted — make it yours."; }},
  led:{label:()=>"How it runs",must:["3.3","3.4","3.2"],path:a=>{ const e=findExp(a); return `tolp.${e.init.id}.experiences#${a}.description`; },
    guide:()=>["What happens, in what sequence and how often — across which terms?","Who leads each part, and what do participants bring, do and take back to class?","Where do teachers try it out, get feedback and follow through?","How does it play out for different staff in the segment?"],
    ctx:a=>leFull(findExp(a))+`\n\nSTAFF CAPABILITY NEEDS:\n${state.context.needs||"(none)"}`, val:a=>findExp(a).x.description,
    ask:m=>`${m==="improve"?"Make these details more concrete and executable, keeping what the school has written where it is sound.":"Plan how this learning experience will actually run, from the SSD's notes and the plan."} Cover: the sequence of activities and cadence across the terms; who facilitates each part; what participants bring, do and take back to class; how they try it out and get feedback; and how it is differentiated for different staff in the segment. Be realistic for a Singapore school calendar (PLT time, staff contact sessions, timetabled periods, assessment periods).`,
    fmt:m=>`${OPTS(2)} In each option write:\nDETAILS: (4–6 lines starting "- ", in the order things happen)\n${WHY}`,
    apply:(o,a,how)=>{ const L=parseLabels(o); return putText(AIF_FIELDS.led.path(a),listText(L.DETAILS||o),how); }},
  diff:{label:()=>"Differentiate for staff profiles",must:["3.1","3.3","2.3"],items:true,
    guide:()=>["Which staff profiles are in this segment — e.g. BTs, experienced teachers, Teacher Leaders, KPs; Emergent, Developing or Proficient on the SFEd Level of Practice?","What does each profile need — entry point, support, stretch, pace, choice?","How can more experienced staff contribute — model, mentor, facilitate — rather than just attend?"],
    ctx:a=>leFull(findExp(a))+`\n\nSTAFF CAPABILITY NEEDS:\n${state.context.needs||"(none)"}\n\nEVIDENCE:\n${trunc(state.context.evidence||"(none)",1200)}`,
    ask:()=>"Suggest how to differentiate this learning experience for the different staff profiles in its segment — by career stage, role, SFEd Level of Practice or readiness, and interest. For each profile, say what changes: the entry point, the support or stretch, the pace or choice, and how their A-R-C mix or role shifts (e.g. experienced teachers model or mentor). Keep it one coherent experience — differentiate within it rather than creating separate programmes. Draw on adult learning principles (need to know, readiness, self-concept, orientation to problems, experience, motivation).",
    fmt:()=>`List 3–4 profiles, one per line, exactly:\n- PROFILE: <who> | HOW: <what changes for them> | WHY: <reason, briefly>`,
    item:(it,a)=>{ const x=findExp(a).x; const line=`For ${it.PROFILE||"[profile]"}: ${it.HOW||it._raw}`; x.description=(has(x.description)?x.description.replace(/\s+$/,"")+"\n":"")+line; return "Added to the details."; }},
  ind:{label:()=>"Programme-level evidence",must:["5.2"],items:true,
    guide:()=>["Which decision will this evidence inform — and who will look at it?","What does this experience already produce that shows change: lesson plans, pupil work, PLT notes, observation records?","Is one source enough? Not every experience needs its own measures."],
    ctx:a=>leFull(findExp(a))+`\n\nSCHOOL-LEVEL KPIs: ${LEARN.map(d=>`${d.k}: ${lines(state.learn[d.k])[0]||"—"}`).join(" | ")}`,
    ask:m=>m==="check"?"Check this evidence plan: is it light enough to sustain, will it inform a real decision, and does it go beyond satisfaction where that matters?":"Suggest light-touch programme-level evidence for this learning experience: at most three sources, preferring what the experience already produces (artefacts, lesson plans, pupil work, PLT records, observation notes) over new surveys, and only where it will inform a decision or a school-level KPI. Fewer, better measures — do not add workload.",
    fmt:m=>m==="check"?CHECK:`List up to 3, one per line, exactly:\n- DIM: <L|E|A|R|N> | INDICATOR: <text> | EVIDENCE: <what already exists or how collected>`,
    item:(it,a)=>{ const x=findExp(a).x, k=learnLetters(it.DIM)[0]||"R"; x.ind[k]=(has(x.ind[k])?x.ind[k].replace(/\s+$/,"")+"\n":"")+(it.INDICATOR||it._raw); return `Added under ${LMAP[k].name}.`; }},
  sig:{label:()=>"Signals to watch",must:["5.1","4.1","1.6"],list:true,path:a=>{ const f=findInit(a); return `objectives#${f.o.id}.initiatives#${a}.signals`; },
    guide:a=>{ const f=findInit(a), g=ISMAP[f&&f.init.stage]; return [`It is ${g?g.label.toLowerCase():"at an early stage"} — what would you expect to notice first if it is working?`,"What would warn you it is slipping, before any survey or KPI shows it?","Where will you notice these — PLT conversations, lesson visits, pupil work, who volunteers?"]; },
    ctx:a=>{ const f=findInit(a); return `INITIATIVE: SI ${f.sn||"–"} ${f.init.title}\nWHERE IT IS NOW: ${(ISMAP[f.init.stage]||{label:"not set"}).label}\nLEARNING EXPERIENCES:\n${exps(a).map(leLine).join("\n")||"(none)"}\nTENSIONS IT ADDRESSES:\n${f.init.tensionIds.map(id=>state.tensions.find(t=>t.id===id)).filter(Boolean).map(tStem).join("\n")||"(none linked)"}`; },
    val:a=>{ const f=findInit(a); return f?f.init.signals:""; },
    ask:m=>`${m==="improve"?"Sharpen these signals.":"Suggest weak signals the school can watch for this initiative."} Weak signals are early, observable, often qualitative signs that it is taking hold or slipping — noticed in PLT conversations, lesson visits, pupil work, staff talk, who volunteers — before any survey or KPI moves. Fit them to the initiative's stage: buy-in and structures when Initiating; consistency and quality of practice when Implementing; ownership, spread and teacher-led continuation when Sustaining. Include at least one warning sign. No new instruments.`,
    fmt:m=>`${OPTS(1)} In the option write:\nTEXT: (3–4 lines starting "- ", each a signal and where it is noticed)\n${WHY}`,
    apply:(o,a,how)=>{ const L=parseLabels(o); return putText(AIF_FIELDS.sig.path(a),listText(L.TEXT||o),how); }},
  refl:{label:()=>"Application, reflection & follow-through",must:["4.2","3.6"],
    guide:()=>["How will you Scaffold, Stimulate and Support reflection?","How will teachers try the learning in class — and who follows up, when?"],
    ctx:a=>leFull(findExp(a)), val:a=>findExp(a).x.reflection,
    ask:m=>m==="check"?"Check this plan for application, reflection and follow-through against the Playbook's guidance on deepening learning through reflection.":"Draft how this experience will support application, reflection (Scaffold, Stimulate, Support) and follow-through into practice. Two to three sentences.",
    fmt:m=>`${OPTS(2)} In each option write:\nTEXT: (two to three sentences)\n${WHY}`,
    apply:(o,a)=>{ findExp(a).x.reflection=txt(o); return "Inserted."; }},
  cond:{label:()=>"Enabling conditions",must:["1.6","3.5","4.1","5.2"],
    guide:()=>["What must be in place for this to work — time, structures and routines, leadership support?","Is it safe for teachers to try this and share what did not work? Do they have a say in it?","Who are the knowledgeable others, and what will stop or be lightened to make room?"],
    ctx:a=>leFull(findExp(a)), val:a=>{ const x=findExp(a).x; return [x.conds.length?"CONDITIONS: "+x.conds.map(k=>CMAP[k].label).join(", "):"",x.cond].filter(has).join("\n"); },
    ask:m=>m==="check"?"Check the enabling conditions for this learning experience. Look across time and workload, structures and routines, leadership support and modelling, trust and psychological safety, teacher voice and choice, knowledgeable others and recognition. Which conditions does this experience most depend on, are they in place, and what is missing or at risk? Do not default to Teacher Leaders.":`Draft the enabling conditions this learning experience relies on. Look across: ${CONDS.map(c=>c.label.toLowerCase()+" ("+c.d.toLowerCase()+")").join("; ")}. Do not default to Teacher Leaders — they are one kind of knowledgeable other. Name only the two to four conditions that matter most for this experience in this school, and say concretely what the school will put in place for each (including what will stop or be lightened to make room). Draw on the LEARN enablers (Empowering Educators, Nurturing Networks), the PLCDR's Shared & Supportive Leadership and Supportive Conditions, the Playbook's learning-culture elements, and research on effective PL (e.g. protected time, coherence with school priorities, collective participation, leadership support).`,
    fmt:m=>m==="check"?`Use headings "In place", "Missing or at risk" and "What to put in place first". Bullet lines start "- ". Under 200 words.`:`${OPTS(2)} In each option write:\nCONDITIONS: (two to four, from: ${CONDS.map(c=>c.label).join(", ")})\nTEXT: (one line per condition starting "- ", saying what will be put in place)\n${WHY}`,
    apply:(o,a)=>{ const L=parseLabels(o), x=findExp(a).x, c=condsIn(L.CONDITIONS||""); if(c.length) x.conds=c; x.cond=listText(L.TEXT||txt(o)); ui.opsOpen[x.id]=true; return "Inserted."; }},
  tolp:{label:()=>"Review of the Total Learning Plan",must:["3.2","3.3","2.2"],checkOnly:true,
    guide:()=>["Is each initiative carried by a coherent mix of A-R-C experiences?","Are the Design Principles really designed in — especially Sustained and Collaborative?","Is a professional learning community being built, or a series of events?","Can the indicators show changed practice?"],
    ctx:()=>allInits().map(({o,init,sn})=>`SI ${sn||"–"} (${anchorTxt(init)||"no anchor"}) — ${init.title}\n${exps(init.id).map(x=>leLine(x)+` | indicators: ${expCoverage(x).join("")||"none"}`).join("\n")||"(no experiences)"}`).join("\n"),
    ask:()=>"Review this Total Learning Plan as a critical friend: coherence across initiatives, the A-R-C mix, the Design Principles, differentiation, the enabling conditions (time, structures, leadership, trust, voice, knowledgeable others, recognition), whether a collaborative learning community is being built, and whether the LEARN evidence can show changed practice.",
    fmt:()=>`Use headings "Strengths", "Gaps to address", "Three changes to consider". Bullet lines starting "- ". Refer to initiatives by SI number. Under 260 words.`},
  interp:{label:a=>`Interpretation · ${LMAP[a.split(":")[1]].name}`,must:["5.2","D"],
    guide:a=>LMAP[a.split(":")[1]].qs,
    ctx:a=>{ const [m,k]=a.split(":"), r=state.learnRev[k]; return `REVIEW: ${m==="mid"?"Mid-year":"Year-end"}\nDIMENSION: ${LMAP[k].name}\nKPI: ${state.learn[k]||"(none)"}\nBASELINE: ${r.baseline||"—"}\nTARGET: ${r.target||"—"}\n${m==="end"&&has(r.midEv)?`MID-YEAR: ${r.midEv} | decision: ${r.midDec}\n`:""}EVIDENCE: ${r[m+"Ev"]||"(none yet)"}\nASSUMPTIONS: ${allAssumptions().map(x=>`${x.code} ${x.a[m].status||"not judged"}`).join("; ")}`; },
    val:a=>{ const [m,k]=a.split(":"); return state.learnRev[k][m+"Dec"]; },
    ask:(md,a)=>{ const m=a.split(":")[0]; return md==="check"?"Check this interpretation and decision: does it answer the guiding questions with the evidence, and is the decision specific and justified?":`Interpret the evidence through the guiding questions and propose a specific, justified decision. ${m==="mid"?"Mid-year is a diagnostic, not a reset: deepen or restructure; do not add initiatives.":"Year-end is a reckoning: what was confirmed, what was challenged, what it means for next year."} If evidence is thin, say what is missing.`; },
    fmt:m=>`${OPTS(2)} In each option write:\nTEXT: (2–4 sentences ending with "Decision:" and the action)\n${WHY}`,
    apply:(o,a)=>{ const [m,k]=a.split(":"); set(`learnRev.${k}.${m}Dec`,txt(o)); return "Inserted."; }},
  insight:{label:()=>"Collective insight",must:["5.2","D"],
    guide:()=>["Are the Enablers in place but not yet converting to Outcomes — or the other way round?","Which assumption best explains what is not moving?"],
    ctx:m=>LEARN.map(d=>`${d.k} ${d.name}: ${state.learnRev[d.k][m+"Ev"]||"(no evidence)"} | ${state.learnRev[d.k][m+"Dec"]||""}`).join("\n")+`\nASSUMPTIONS: ${allAssumptions().map(x=>`${x.code} ${x.a[m].status||"not judged"}`).join("; ")}`,
    val:m=>state.insight[m],
    ask:md=>md==="check"?"Check this collective insight: does it read across Enablers and Outcomes and point to a cause?":"Write the collective insight, reading across both Enablers and all three Outcomes.",
    fmt:m=>`${OPTS(2)} In each option write:\nTEXT: (3–4 sentences)\n${WHY}`,
    apply:(o,m)=>{ set(`insight.${m}`,txt(o)); return "Inserted."; }},
  tnote:{label:a=>`What has changed · ${tNo(a.split(":")[1])}`,must:["2.3","5.1"],
    guide:()=>["What does the evidence now show about this gap?","Is the gap closing, closed (Resolved) — or has the problem shifted, so the stem needs rewriting?"],
    ctx:a=>{ const [m,id]=a.split(":"), t=state.tensions.find(x=>x.id===id); return `REVIEW: ${m==="mid"?"Mid-year":"Year-end"}\nTENSION: ${tStem(t)}\nLINKED INITIATIVES: ${allInits().filter(x=>x.init.tensionIds.includes(id)).map(x=>`SI ${x.sn||"–"} ${x.init.title}`).join("; ")||"none"}\nLEARN EVIDENCE: ${LEARN.map(d=>`${d.k}: ${state.learnRev[d.k][m+"Ev"]||"—"}`).join(" | ")}`; },
    val:a=>{ const [m,id]=a.split(":"); return state.tensions.find(x=>x.id===id).rnote[m]; },
    ask:md=>md==="check"?"Check this note: does it use evidence to say how the tension has shifted and what it means next?":"Write a short note on how this creative tension has shifted, using the evidence, and suggest its status: Emerging, Addressing or Resolved. If the problem now looks different, say how the stem should be rewritten.",
    fmt:m=>`${OPTS(2)} In each option write:\nTEXT: (2–3 sentences)\n${WHY}`,
    apply:(o,a)=>{ const [m,id]=a.split(":"); set(`tensions#${id}.rnote.${m}`,txt(o)); return "Inserted."; }},
  feedback:{label:()=>"Feedback loop",must:["5.1","G"],
    guide:()=>[TOC.fb.q],
    ctx:m=>`ASSUMPTION CHECK:\n${allAssumptions().map(x=>`${x.code} [${x.a[m].status||"not judged"}] ${x.a.text}${has(x.a[m].note)?` — ${x.a[m].note}`:""}`).join("\n")||"(none)"}\n\nINSIGHT: ${state.insight[m]||"(none)"}\n\nTENSIONS:\n${state.tensions.map(t=>`${tStem(t)} ${t.rnote[m]?"— "+t.rnote[m]:""}`).join("\n")}`,
    val:m=>state.toc.feedback[m],
    ask:(md,m)=>md==="check"?"Check this feedback loop: does it change the understanding of the problem and say what the ToLP must carry?":`Draft the feedback loop: what this ${m==="mid"?"half-year":"cycle"} taught us that changes how we understand the problem, and what it means for ${m==="mid"?"Terms 3–4":"next year's ToLP"}.`,
    fmt:m=>`${OPTS(2)} In each option write:\nTEXT: (2–4 sentences)\n${WHY}`,
    apply:(o,m)=>{ set(`toc.feedback.${m}`,txt(o)); return "Inserted."; }},
  sidec:{label:()=>"Decision rationale",must:["5.2"],
    guide:()=>["What did the evidence confirm, and what did it challenge?","Continue, deepen, restructure or stop — and why?"],
    ctx:a=>{ const f=findInit(a); return `INITIATIVE: SI ${f.sn||"–"} ${f.init.title}\nDECISION: ${f.init.review.decision||"(not chosen)"}\nEXPERIENCES:\n${exps(a).map(x=>leLine(x)+` | status: ${x.status}; ${x.enactNote} ${x.adjust}`).join("\n")}\nYEAR-END EVIDENCE: ${LEARN.map(d=>`${d.k}: ${state.learnRev[d.k].endEv||"—"}`).join(" | ")}`; },
    val:a=>findInit(a).init.review.note,
    ask:md=>md==="check"?"Check this rationale: is the decision justified by the evidence?":"Write the rationale for this initiative's next move — Sustain, Scale, Adjust or Stop — from the evidence, the signals the school has been watching and where the initiative now is (initiating, implementing or sustaining). Two to three sentences.",
    fmt:m=>`${OPTS(2)} In each option write:\nTEXT: (2–3 sentences)\n${WHY}`,
    apply:(o,a)=>{ const f=findInit(a); set(`objectives#${f.o.id}.initiatives#${a}.review.note`,txt(o)); return "Inserted."; }}
};

/* ---------- helpers ---------- */
function txt(o){ const L=parseLabels(o); return L.TEXT||clean(o); }
function clean(t){ return String(t||"").replace(/^\s*(\*\*)?(statement|objective|option \d+|text)(\*\*)?\s*:\s*/i,"").replace(/\*\*/g,"").trim(); }
function listText(t){ return String(t||"").replace(/\*\*/g,"").split(/\n/).map(l=>l.replace(/^\s*([-•*]|\d+[.)])\s*/,"").trim()).filter(Boolean).join("\n"); }
function putText(path,text,how){ const cur=get(path)||""; set(path,how==="add"&&has(cur)?cur.replace(/\s+$/,"")+"\n"+text:text); return how==="add"?"Added.":"Inserted."; }
/* Model output varies (bold labels, "Option 1:" headers, numbered lines, preambles, code fences) —
   parse tolerantly, but only treat known labels as labels so a line like "- PLT: …" stays content. */
const LABELS=new Set(["TAG","AIM","CURRENTLY","RESULTING","WHY","TITLE","DESCRIPTION","STATEMENT","ANCHOR","KPI","TARGET","SOURCE","MID-YEAR SIGNAL","HEADLINE","POINTS","ARC","PRINCIPLES","DETAILS","SEGMENT","RESOURCES","TERMS","STRUCTURES","REFLECTION","TL ROLE","CONDITIONS","PUT IN PLACE","IND-L","IND-E","IND-A","IND-R","IND-N","DESIGN NOTES","PROFILE","HOW","TEXT","ASSUMPTION","OWNER","HORIZON","OUTCOME","LEARN","DIM","INDICATOR","EVIDENCE"]);
const OPT_LINE=/^[ \t]*(?:#{1,4}[ \t]*)?(?:\*\*)?[ \t]*Option[ \t]*\d+[ \t]*(?:\*\*)?[ \t]*(?:[:.)\-–—][^\n]*)?$/i;
function splitOptions(ans){ const t=String(ans||"").replace(/^```[a-z]*\s*|```\s*$/g,"").trim(); const L=t.split(/\n/); const parts=[]; let cur=null;
  L.forEach(line=>{ if(OPT_LINE.test(line.replace(/\*\*/g,""))){ cur=[]; parts.push(cur); } else if(cur) cur.push(line); });
  const out=parts.map(p=>p.join("\n").trim()).filter(Boolean); return out.length?out:[t]; }
const labelOf=s=>{ const k=String(s||"").replace(/\*\*/g,"").trim().toUpperCase().replace(/\s+/g," "); return LABELS.has(k)?k:null; };
function parseLabels(text){ const out={}; let cur=null; String(text||"").replace(/\*\*/g,"").split(/\n/).forEach(line=>{ const m=line.match(/^\s*(?:[-•*]|\d+[.)])?\s*([A-Za-z][A-Za-z\- ]{1,20}?)\s*:\s*(.*)$/); const k=m&&labelOf(m[1]); if(k){ cur=k; out[cur]=m[2].trim(); } else if(cur&&line.trim()) out[cur]=(out[cur]?out[cur]+"\n":"")+line.trim(); }); return out; }
function parseItems(ans){ return String(ans||"").replace(/\*\*/g,"").split(/\n/).map(l=>l.trim()).filter(l=>l.length>4&&!OPT_LINE.test(l)&&(/^([-•*]|\d+[.)])\s/.test(l)||/\|/.test(l)&&/^[A-Za-z\- ]{2,20}:/.test(l))).map(l=>{ const raw=l.replace(/^([-•*]|\d+[.)])\s*/,""); const it={_raw:raw}; raw.split("|").forEach(seg=>{ const m=seg.match(/^\s*([A-Za-z][A-Za-z\- ]{1,20}?)\s*:\s*(.*)$/); const k=m&&labelOf(m[1]); if(k) it[k]=m[2].trim(); }); return it; }); }
const LNAMES={E:/empower/i,N:/nurtur|network/i,R:/resonan/i,L:/\blearning\b/i,A:/adoption|application/i};
function learnLetters(v){ v=String(v||""); const byName=Object.keys(LNAMES).filter(k=>LNAMES[k].test(v)); if(byName.length) return byName; return [...new Set(v.toUpperCase().match(/\b[ENRLA]\b/g)||[])]; }
function fmtAnswer(t){ return esc(String(t||"").replace(/\*\*/g,"")).split(/\n{2,}/).map(b=>{ const L=b.split(/\n/).map(x=>x.trim()).filter(Boolean); if(L.length&&L.every(x=>/^[-•]\s+/.test(x))) return "<ul>"+L.map(x=>"<li>"+x.replace(/^[-•]\s+/,"")+"</li>").join("")+"</ul>"; if(L.length&&/^#{1,4}\s/.test(L[0])) return `<h5>${L[0].replace(/^#+\s*/,"")}</h5>`+(L.length>1?(L.slice(1).every(x=>/^[-•]\s+/.test(x))?"<ul>"+L.slice(1).map(x=>"<li>"+x.replace(/^[-•]\s+/,"")+"</li>").join("")+"</ul>":"<p>"+L.slice(1).join("<br>")+"</p>"):""); return "<p>"+L.join("<br>")+"</p>"; }).join(""); }
function fmtOption(o){ const L=parseLabels(o), keys=Object.keys(L).filter(k=>has(L[k])); if(keys.length<2) return fmtAnswer(o);
  const nice=k=>({ARC:"A-R-C","TL ROLE":"Teacher Leaders","CONDITIONS":"Enabling conditions","PUT IN PLACE":"What we will put in place","IND-L":"Learning","IND-E":"Empowering Educators","IND-A":"Adoption","IND-R":"Resonance","IND-N":"Nurturing Networks","WHY":"Why this could work","DESIGN NOTES":"How it answers the 10 Questions","MID-YEAR SIGNAL":"Mid-year signal","TEXT":"Draft"})[k]||k.charAt(0)+k.slice(1).toLowerCase();
  const note=k=>k==="WHY"||k==="DESIGN NOTES";
  return `<dl class="aidl">${keys.map(k=>`<dt class="${note(k)?"why":""}">${esc(nice(k))}</dt><dd class="${note(k)?"why":""}">${fmtAnswer(L[k])}</dd>`).join("")}</dl>`; }

/* fetch with a time limit, so a stalled request doesn't leave the panel spinning */
async function fetchT(url,opts,ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||60000);
  try{ return await fetch(url,{...opts,signal:c.signal}); }catch(e){ if(e.name==="AbortError") throw new Error("PL Buddy took too long to answer — please try again."); throw e; } finally{ clearTimeout(t); } }

/* ---------- the inline panel ---------- */
const AIF={key:null,arg:"",notes:"",answer:"",busy:false,err:"",mode:"",history:[],refs:[],used:{},sent:"",tok:0};
const aiKey=(k,a)=>k+"|"+(a||"");
function aif(key,arg="",label){ const on=AIF.key&&aiKey(AIF.key,AIF.arg)===aiKey(key,arg); return `<button type="button" class="aif ${on?"on":""}" data-aif="${key}" data-arg="${esc(arg)}" title="Draft or check this with PL Buddy, drawing on the PL Playbook">${sparkIco}${label||"PL Buddy"}</button>`; }
function aiSlot(key,arg=""){ if(!AIF.key||aiKey(AIF.key,AIF.arg)!==aiKey(key,arg)) return ""; return `<div class="aipanel" id="aiPanel">${aiPanelInner()}</div>`; }
function aiCurVal(){ const F2=AIF_FIELDS[AIF.key]; if(!F2) return ""; if(F2.val) return F2.val(AIF.arg)||""; if(F2.path) return get(F2.path(AIF.arg))||""; return ""; }
function aiPanelInner(){
  const F2=AIF_FIELDS[AIF.key]; if(!F2) return "";
  const cur=aiCurVal(), canImprove=!F2.items&&!F2.checkOnly&&has(cur), canTest=F2.tenq&&has(cur);
  let res="";
  if(AIF.busy) res=`<div class="aibusy"><span class="plb-typing"><span></span><span></span><span></span></span> PL Buddy is thinking it through…</div>`;
  else if(AIF.err) res=`<div class="aierr"><b>Couldn’t reach PL Buddy.</b> ${esc(AIF.err)}<div class="aierr-a"><button class="tbtn sm" data-aicopy>Copy the prompt</button><span class="subtle">to paste into PL Buddy on the Playbook site or another approved tool</span></div></div>`;
  else if(AIF.answer){
    if(AIF.mode==="check"||F2.checkOnly) res=`<div class="aiopt"><div class="aiot">${fmtAnswer(AIF.answer)}</div></div>`;
    else if(F2.items){ const its=parseItems(AIF.answer); res=`<div class="aiopts">${its.length?its.map((it,i)=>`<div class="aiopt item"><div class="aiot">${Object.entries(it).filter(([k])=>k!=="_raw").map(([k,v])=>`<div><b>${esc(k.toLowerCase())}</b> ${esc(v)}</div>`).join("")||esc(it._raw)}</div><button class="tbtn blue sm" data-aiitem="${i}" ${AIF.used[i]?"disabled":""}>${AIF.used[i]?"Added ✓":"Add"}</button></div>`).join(""):`<div class="aiot">${fmtAnswer(AIF.answer)}</div>`}</div>`; }
    else { const opts=splitOptions(AIF.answer); res=`<div class="aiopts">${opts.map((o,i)=>`<div class="aiopt"><div class="aioh"><b>Option ${i+1}</b><span class="spacer"></span>${F2.list&&has(cur)?`<button class="tbtn sm" data-aiuse="${i}" data-how="add">Add to mine</button>`:""}<button class="tbtn blue sm" data-aiuse="${i}" data-how="replace">${has(cur)?"Replace with this":"Use this"}</button></div><div class="aiot">${fmtOption(o)}</div></div>`).join("")}</div>`; }
    if(AIF.refs.length) res+=`<div class="airefs"><b>Drawn from</b>${AIF.refs.map(r=>r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source||"PL Playbook")} · ${esc(r.title)}</a>`:`<span>${esc(r.source||"")} · ${esc(r.title)}</span>`).join("")}</div>`;
    res+=`<div class="airefine"><span class="subtle">Refine:</span>${["More specific","Shorter","Closer to our evidence","More teacher-led"].map(q=>`<button class="chip sm" data-airef="${q}">${q}</button>`).join("")}<input id="aiRefine" placeholder="or tell PL Buddy what to change…"><button class="tbtn sm" data-airef="">Go</button></div>`;
  }
  return `<div class="aph">${sparkIco}<b>PL Buddy</b><span class="apl">· ${esc(F2.label(AIF.arg))}</span><span class="spacer"></span><button class="iconbtn" data-aiclose title="Close" aria-label="Close PL Buddy">✕</button></div>
    <div class="apbody"><div class="apq"><small>Think about</small><ul>${F2.guide(AIF.arg).map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>
    ${F2.checkOnly?"":`<textarea id="aiNotes" class="apnotes" rows="2" placeholder="Jot your thinking — rough notes, numbers, keywords. PL Buddy uses them with the rest of your plan.">${esc(AIF.notes)}</textarea>`}
    ${F2.tenq?`<details class="aptenq"><summary>The 10 Questions for design <span class="subtle">· PL Buddy uses these</span></summary><ol>${TEN_Q.map(x=>`<li><b>${esc(x.q)}</b> <span class="subtle">${esc(x.p)}</span></li>`).join("")}</ol></details>`:""}
    <div class="apbtns">${F2.checkOnly?`<button class="tbtn blue sm" data-aimode="check">Review it</button>`:`<button class="tbtn blue sm" data-aimode="draft">${F2.items?"Suggest":"Draft it"}</button>${canImprove?`<button class="tbtn sm" data-aimode="improve">Improve what I wrote</button>`:""}${canTest?`<button class="tbtn sm" data-aimode="check">Test it against the 10 Questions</button>`:""}`}</div>
    ${res}
    <p class="apnote">AI-generated suggestions can be inaccurate or generic. Check them, and adapt them to your school’s context, before you use them. Don’t put names or personal data in your notes.</p></div>`;
}
function aiMessage(mode,refine){
  const F2=AIF_FIELDS[AIF.key]; if(!F2) return "";
  const cur=aiCurVal();
  /* a refine resends the whole request with the previous answer, so the format and plan context are never lost */
  if(refine) return aiMessage(mode)+anon(`\n\nYOUR PREVIOUS ANSWER:\n${AIF.answer}\n\nREVISE IT: ${refine}. Keep the same OUTPUT FORMAT as above.`);
  return anon(`You are PL Buddy, helping a School Staff Developer (SSD) or school leader write one field of their school's Professional Learning Plan. You can see the whole plan, and excerpts from across the PL Playbook.\n\nFIELD: ${F2.label(AIF.arg)}\nTASK: ${F2.ask(mode,AIF.arg)}\n\n${RULES}\n\nTHE SSD'S NOTES: ${has(AIF.notes)?AIF.notes:"(none)"}\n${(mode==="improve"||mode==="check")&&has(cur)?`\nWHAT THEY HAVE WRITTEN:\n${cur}\n`:""}\nFOCUS — THE PARTS OF THE PLAN THIS FIELD DEPENDS ON:\n${F2.ctx(AIF.arg)}\n\nTHE SCHOOL'S WHOLE PLAN SO FAR (for context; keep your suggestion consistent with it):\n${planDigest()}\n\nOUTPUT FORMAT: ${F2.fmt(mode,AIF.arg)}`);
}
function aiPaint(){ const p=$("#aiPanel"); if(p){ p.innerHTML=aiPanelInner(); } $$("[data-aif]").forEach(b=>b.classList.toggle("on",AIF.key&&aiKey(b.dataset.aif,b.dataset.arg)===aiKey(AIF.key,AIF.arg))); }
function aiOpenField(key,arg){
  if(AIF.key&&aiKey(AIF.key,AIF.arg)===aiKey(key,arg)){ aiCloseField(); return; }
  Object.assign(AIF,{key,arg:arg||"",notes:"",answer:"",busy:false,err:"",mode:"",history:[],refs:[],used:{},sent:"",tok:AIF.tok+1});
  render(true);
  setTimeout(()=>{ const p=$("#aiPanel"); if(p){ const r=p.getBoundingClientRect(); if(r.top<80||r.bottom>window.innerHeight) p.scrollIntoView({block:"nearest",behavior:"smooth"}); const n=$("#aiNotes"); if(n) n.focus({preventScroll:true}); } },30);
}
function aiCloseField(){ AIF.key=null; AIF.busy=false; AIF.tok++; render(true); }
async function aiRun(mode,refine){
  const F2=AIF_FIELDS[AIF.key]; if(!F2||AIF.busy) return;
  if(aiTargetGone()){ aiCloseField(); return toast("That item has been removed"); }
  if(!refine) AIF.mode=mode;
  const tok=++AIF.tok;
  const message=aiMessage(AIF.mode,refine);
  const query=`${F2.label(AIF.arg)} ${F2.guide(AIF.arg).join(" ")} ${AIF.notes}`;
  const context=kbRetrieve(F2.ask(AIF.mode,AIF.arg)+" "+query,[...(F2.must||[]),...(ACROSS[FIELD_KIND[AIF.key]]||[])].filter((x,i,a)=>a.indexOf(x)===i),8);
  AIF.sent=message; AIF.busy=true; AIF.err=""; AIF.used={}; aiPaint();
  try{
    if(!CONFIG.AI_URL) throw new Error("PL Buddy is not connected yet.");
    const res=await fetchT(CONFIG.AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:[],context,mode:"builder",task:AIF.key,query:anon(query)})},90000);
    const data=await res.json().catch(()=>({}));
    if(tok!==AIF.tok) return;   // the user moved on to another field: drop this late reply
    if(!res.ok) throw new Error(data.error||("Request failed ("+res.status+")"));
    if(!has(data.answer)) throw new Error("PL Buddy sent back an empty answer — please try again.");
    AIF.answer=data.answer||""; AIF.refs=(data.references||context.slice(0,3)).map(r=>({id:r.id,title:r.title||(KBI[r.id]||{}).title||r.id,source:r.source||(KBI[r.id]?"PL Playbook":""),url:r.url||(KBI[r.id]?CONFIG.PLAYBOOK_URL+"#sec-"+r.id:"")}));
  }catch(err){ if(tok!==AIF.tok) return; AIF.err=(err&&err.message)||"Something went wrong."; }
  finally{ if(tok===AIF.tok){ AIF.busy=false; aiPaint(); } }
}
function aiTargetGone(){ const k=AIF.key, a=AIF.arg.includes(":")?AIF.arg.split(":")[1]:AIF.arg;
  if(k==="thrust") return !state.thrusts.some(x=>x.id===a);
  if(k==="so") return !state.objectives.some(x=>x.id===a);
  if(k==="si"||k==="sidec") return !findInit(a);
  if(["le","led","diff","ind","refl","cond"].includes(k)) return !findExp(a);
  if(k==="sig") return !findInit(a);
  if((k==="tension"&&a!=="new")||k==="tnote") return !state.tensions.some(x=>x.id===a);
  return false; }
function aiUse(i,how){ const F2=AIF_FIELDS[AIF.key], o=splitOptions(AIF.answer)[i]; if(!F2.apply||o==null) return;
  if(aiTargetGone()){ aiCloseField(); return toast("That item has been removed — nothing was inserted"); }
  const before=JSON.stringify(state); const msg=F2.apply(o,AIF.arg,how);
  if(JSON.stringify(state)===before){ toast("Couldn’t read that option — copy what you need from it instead"); return; }
  AIF.key=null; markDirty(); render(true); toast(msg||"Inserted"); }
function aiItem(i){ const F2=AIF_FIELDS[AIF.key], it=parseItems(AIF.answer)[i]; if(!F2.item||!it) return;
  if(aiTargetGone()){ aiCloseField(); return toast("That item has been removed — nothing was added"); }
  const msg=F2.item(it,AIF.arg); AIF.used[i]=true; markDirty(); render(true); toast(msg||"Added"); }

/* ---------- Ask PL Buddy (free questions, no plan content) ---------- */
const CHAT={open:false,busy:false,msgs:[],err:"",usePlan:true};
function chatDraw(){
  const d=$("#aiDrawer"); if(!d) return;
  d.classList.toggle("show",CHAT.open); d.setAttribute("aria-hidden",CHAT.open?"false":"true");
  if(!CHAT.open){ d.innerHTML=""; return; }
  d.innerHTML=`<div class="aihd">${sparkIco}<div><b>Ask PL Buddy</b><small>About the PL Playbook${CHAT.usePlan?" and your plan":""}</small></div><span class="spacer"></span><button class="iconbtn" data-chatclose aria-label="Close">✕</button></div>
    <div class="aibody">${CHAT.msgs.length?CHAT.msgs.map(m=>`<div class="cmsg ${m.role}">${m.role==="assistant"?fmtAnswer(m.content):esc(m.content)}${m.refs&&m.refs.length?`<div class="airefs">${m.refs.map(r=>`<a href="${esc(r.url||"#")}" target="_blank" rel="noopener">${esc(r.title)}</a>`).join("")}</div>`:""}</div>`).join(""):`<p class="subtle">Ask anything about the Playbook — designing with A-R-C, the Design Principles, building PLCs, LEARN, the Theory of Change.</p><div class="aichips">${["How do I combine A-R-C modes for a PLT?","What makes a good creative tension?","How do I evidence Adoption, not just Resonance?","What should a mid-year review look like?"].map(q=>`<button class="chip sm" data-chatq="${esc(q)}">${esc(q)}</button>`).join("")}</div>`}
    ${CHAT.busy?`<div class="aibusy"><span class="plb-typing"><span></span><span></span><span></span></span></div>`:""}${CHAT.err?`<div class="aierr">${esc(CHAT.err)}</div>`:""}</div>
    <label class="aiuse"><input type="checkbox" data-chatplan ${CHAT.usePlan?"checked":""}> Let PL Buddy read my plan <span class="subtle">(school name hidden)</span></label><div class="aifoot"><textarea id="chatIn" rows="2" placeholder="Ask PL Buddy…"></textarea><button class="tbtn blue" data-chatsend>Ask</button></div>`;
  const b=d.querySelector(".aibody"); b.scrollTop=b.scrollHeight;
}
async function chatAsk(q){
  q=(q||"").trim(); if(!q||CHAT.busy) return;
  CHAT.msgs.push({role:"user",content:q}); CHAT.busy=true; CHAT.err=""; chatDraw();
  const context=kbRetrieve(q,[],6);
  const message=CHAT.usePlan&&hasContent()?anon(`${q}\n\n---\nMY SCHOOL'S PL PLAN SO FAR (for context — refer to it where it helps, and say which Playbook sections you draw on):\n${planDigest(9000)}`):anon(q);
  try{ const res=await fetchT(CONFIG.AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:CHAT.msgs.slice(-7,-1).map(m=>({role:m.role,content:anon(m.content)})),context,mode:CHAT.usePlan?"plan-chat":undefined,query:anon(q)})});
    const data=await res.json().catch(()=>({})); if(!res.ok) throw new Error(data.error||("Request failed ("+res.status+")"));
    CHAT.msgs.push({role:"assistant",content:data.answer||"",refs:(data.references||context.slice(0,3)).map(r=>({title:r.title,url:r.url||(KBI[r.id]?CONFIG.PLAYBOOK_URL+"#sec-"+r.id:"")}))});
  }catch(e){ CHAT.err="Couldn’t reach PL Buddy. "+(e.message||""); }
  finally{ CHAT.busy=false; chatDraw(); }
}

document.addEventListener("input",e=>{ if(e.target.id==="aiNotes") AIF.notes=e.target.value; });
document.addEventListener("click",e=>{
  const t=e.target;
  const f=t.closest("[data-aif]"); if(f){ e.preventDefault(); aiOpenField(f.dataset.aif,f.dataset.arg); return; }
  if(t.closest("[data-aiclose]")) return aiCloseField();
  const md=t.closest("[data-aimode]"); if(md) return aiRun(md.dataset.aimode);
  const u=t.closest("[data-aiuse]"); if(u) return aiUse(+u.dataset.aiuse,u.dataset.how);
  const it=t.closest("[data-aiitem]"); if(it) return aiItem(+it.dataset.aiitem);

document.addEventListener("keydown",e=>{

async function makePackPdf(){
  const sig=JSON.stringify(state); if(PACKC.blob&&PACKC.sig===sig) return PACKC.blob;
  await ensurePdfLibs(); try{ await document.fonts.ready; }catch(e){}
  const A3=state.toc.opts.paper==="A3", LAND=A3?{w:420,h:297,m:9}:{w:297,h:210,m:9}, PORT={w:210,h:297,m:14};
  buildPrint("pack"); const pd=$("#printDoc"); pd.classList.add("capture");
  try{
    const secs=[...pd.children].filter(el=>!el.classList.contains("plpayload"));
    const {jsPDF}=window.jspdf; let doc=null;
    const shoot=el=>window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true,scrollX:0,scrollY:0,windowWidth:Math.max(1600,el.offsetWidth+40),
      ignoreElements:e=>!(e===document.documentElement||e===document.head||e===document.body||(e.closest&&e.closest("head,#printDoc"))||(e.contains&&e.contains(pd)))});
    const addPage=P=>{ const o=P.w>P.h?"l":"p"; if(!doc) doc=new jsPDF({unit:"mm",format:[P.w,P.h],orientation:o,compress:true}); else doc.addPage([P.w,P.h],o); };
    const addWords=(words,P,y0,y1,k)=>{ doc.setFont("helvetica","normal");
      words.forEach(w=>{ if(w.y<y0-1||w.y+w.h/2>=y1) return; const t=pdfSafe(w.t); if(!t) return;
        const pt=Math.max(5,w.h/1.2*0.75*k); doc.setFontSize(pt); const nat=doc.getTextWidth(t)||1, hs=Math.max(0.3,Math.min(3,(w.w*k/MMPX)/nat));
        doc.text(t,P.m+w.x*k/MMPX,P.m+(w.y-y0+w.h*0.78)*k/MMPX,{renderingMode:"invisible",horizontalScale:hs}); }); };
    pd.querySelectorAll(".plpayload").forEach(e=>e.style.display="none");
    for(const sec of secs){
      const P=sec.classList.contains("pg-land")?LAND:PORT, cw=(P.w-2*P.m)*MMPX, ch=(P.h-2*P.m)*MMPX;
      sec.style.width=cw+"px"; await nextFrame();
      const zoomed=[...sec.querySelectorAll("[style*='zoom']")].find(e=>parseFloat(e.style.zoom)&&parseFloat(e.style.zoom)!==1);
      if(zoomed){

        const z=parseFloat(zoomed.style.zoom), words=wordBoxes(sec), h=sec.scrollHeight;
        zoomed.style.zoom=1; sec.style.width=(cw/z)+"px"; await nextFrame();
        const cv=await shoot(sec); addPage(P);

        addWords(words,P,0,h+1,1); continue;
      }
      const words=wordBoxes(sec), cuts=pageBreaks(sec,ch,words);
      const holder=sec.parentNode, next=sec.nextSibling;
      const win=document.createElement("div"); win.style.cssText=`position:relative;overflow:hidden;width:${cw}px;background:#fff`;
      const inner=document.createElement("div"); inner.style.cssText=`position:absolute;left:0;width:${cw}px`;
      win.appendChild(inner); holder.insertBefore(win,next); inner.appendChild(sec);
      try{

          const y0=cuts[i], y1=cuts[i+1];

          const cv=await shoot(win); addPage(P);

  } finally { pd.classList.remove("capture"); pd.innerHTML=""; }
}

/* The hidden plan data is printed in tiny text (5px in older builders, 1px now). Read only tiny text,
   so a table heading the PDF reader returns out of order can't land in the middle of it. */
const TINY=it=>{ const h=Math.abs(it.transform[3])||it.height||99; return h<4.6; };
function pdfPayload(pages){ try{ return extractPayload(pages.map(pg=>pg.items.filter(TINY).map(i=>i.str).join("")).join("")); }catch(e){ return null; } }
function extractPayload(text){ const m=text.replace(/\s+/g,"").match(/PLPLANv[12]:([A-Za-z0-9+/=]+):ENDPLPLAN/); return m?JSON.parse(b64decode(m[1])):null; }

async function importPlan(obj,msg){
  if(!looksLikePlan(obj)){ toast("That file doesn’t contain a PL plan"); return; }
  if(hasContent()){ const n=(obj.meta&&obj.meta.schoolName)||"this file"; if(!(await ask("Replace the plan on screen?",`The plan from ${n} will replace what is on screen. A backup is kept — File ▸ Restore the previous plan brings it back.`,"Replace"))) return; backupPlan(); }
  loadState(obj,msg);
}
function loadState(obj,msg){ state=normalize(obj); ui.example=false; render(); Store.save(state); $("#saveState").textContent="All changes saved"; toast(msg); }
async function importFile(f){
  const nm=(f.name||"").toLowerCase();
  try{
    if(nm.endsWith(".docx")){ const xml=await unzipEntry(await f.arrayBuffer(),"word/document.xml"); if(!xml){ toast("That doesn't look like a Word file"); return; }
      const p=extractPayload(xml.replace(/<[^>]+>/g,"")); if(!p){ toast("No embedded plan data in this Word file"); return; } await importPlan(p,"Plan imported from Word — as it was when saved from the builder (edits made in Word aren’t picked up)"); }
    else if(nm.endsWith(".pdf")){ toast("Reading PDF…");
      try{ await ensurePdfJs(); }catch(e){ toast("PDF import needs an internet connection — try the .docx or .json"); return; }
      const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise; let text=""; const pages=[];
      for(let p=1;p<=pdf.numPages;p++){ const pg=await pdf.getPage(p); const c=await pg.getTextContent(); const vp=pg.getViewport({scale:1}); text+=c.items.map(i=>i.str).join(""); pages.push({h:vp.height,items:c.items}); }
      const p=pdfPayload(pages)||extractPayload(text); if(p){ await importPlan(p,"Plan imported from PDF"); return; }
      const r=recoverFromPdfText(pages);
      if(r){ await importPlan(r,"Plan recovered from the PDF’s text — please check each section"); return; }
      toast("Couldn’t find a PL plan in this PDF — try the .docx or .json"); }
    else { await importPlan(JSON.parse(await f.text()),"Plan imported"); }
  }catch(e){ console.error(e); toast(nm.endsWith(".pdf")?"Couldn’t read that PDF — try the .docx or .json":"Couldn't read that file"); }
}
/* ---------- recover a plan from the visible text of an older PDF ----------
   PDFs saved from the original builder (v1) in Chrome lose the hidden plan data,
   because Chrome drops transparent text. This rebuilds the plan from the printed
   poster: VMV, tensions, thrusts, objectives/initiatives, LEARN and the ToLP table. */
function pdfLines(pages){
  const out=[];
  pages.forEach((pg,pi)=>{ let cur=null, brk=true;
    pg.items.forEach(it=>{
      if(TINY(it)&&(it.str||"").trim()) return;   // hidden plan data, not part of the printed plan
      const str=it.str||""; const x=it.transform[4], y=pg.h-it.transform[5], w=it.width||0, sz=Math.abs(it.transform[3])||it.height||10;
      if(!str.trim()){ if(it.hasEOL&&!str.length) brk=true; else if(cur&&str.length) cur.text+=" "; if(it.hasEOL) cur=null; return; }
      if(cur&&!brk&&Math.abs(cur.y-y)<2.5&&x>=cur.xe-2&&x-cur.xe<14){ const gap=x-cur.xe; cur.text+=(gap>sz*0.18&&!/\s$/.test(cur.text)?" ":"")+str; cur.xe=x+w; cur.items.push({x,str}); }
      else { cur={page:pi,x,y,xe:x+w,sz,text:str,brk,items:[{x,str}]}; out.push(cur); }
      brk=false; if(it.hasEOL) cur=null;
    });
  });
  out.forEach(l=>l.text=l.text.replace(/\s+/g," ").trim());
  return out.filter(l=>l.text&&l.text!=="▼");
}
function recoverFromPdfText(pages){

  (sec.vmv||[]).forEach(l=>{ const isLab=/[A-Z]/.test(l.text)&&l.text===l.text.toUpperCase()&&l.text.length<40&&(labSz===null||Math.abs(l.sz-labSz)<0.6); if(isLab&&labSz===null) labSz=l.sz;
    if(isLab&&(l.brk||!buf.length&&lab)){ if(lab&&!buf.length) lab+=" "+l.text; else { putV(); lab=l.text; buf=[]; } } else buf.push(l); });

    tl.forEach(l=>{ const t=l.text, flat=t.replace(/\s+/g,"");

}
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{ if(!window.pdfjsLib){rej(new Error("pdfjs"));return;} window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(); };
    s.onerror=()=>rej(new Error("pdfjs")); document.head.appendChild(s); });
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=rej; r.readAsDataURL(blob); }); }
/* ---------- Share with PDPO: one click ----------
   Makes the full cycle pack — the same file "Save as PDF ▸ Full cycle pack" downloads — and sends it to
   PDPO's email with the plan data, through the existing Apps Script. No dialog, no other service. */
let SHARING=false;
async function shareWithPDPO(){
  if(!CONFIG.SHARE_URL||SHARING) return;
  if(!has(state.meta.schoolName)){ toast("Please add your school name first"); $("#schoolName").focus(); return; }
  SHARING=true; toast("Sending your full cycle pack to PDPO…");
  let pdf="";
  try{ pdf=await blobToB64(await makePackPdf()); }catch(e){ console.error(e); /* send the plan data on its own */ }
  try{
    await fetch(CONFIG.SHARE_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({school:state.meta.schoolName,year:state.meta.year,kind:"full-cycle-pack",pdfName:pdf?pdfFileName("pack"):"",pdf,plan:state})});
    toast(pdf?"Shared with PDPO — your full cycle pack is on its way":"Shared your plan with PDPO. The PDF couldn’t be made just now, so PDPO will open your plan in the builder.");
  }catch(e){ toast("Couldn’t reach PDPO — check your connection and try again"); }
  finally{ SHARING=false; }
}

/* =====================================================================
   EVENTS & BOOT
   ===================================================================== */
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),Math.max(2400,Math.min(7000,String(msg).length*55))); }
function ask(title,msg,ok){ return new Promise(res=>{ const m=$("#modal"); $("#mTitle").textContent=title; $("#mMsg").textContent=msg; $("#mOk").textContent=ok||"Continue"; m.classList.add("show");
  const done=v=>{ m.classList.remove("show"); $("#mOk").onclick=$("#mCancel").onclick=null; res(v); }; $("#mOk").onclick=()=>done(true); $("#mCancel").onclick=()=>done(false); }); }
/* navigation: Build (one page of sections) and View (lenses) */
function setMode(m,lens){ ui.mode=m==="view"?"view":"build"; if(lens&&LENSM[lens]) ui.lens=lens; setHash(); render(); window.scrollTo(0,0); }
function setHash(){ const h="#"+(ui.mode==="view"?"view/"+ui.lens:"build"); if(location.hash!==h){ try{ history.replaceState(null,"",h); }catch(e){} } }
function goSection(id){ if(ui.mode!=="build"){ ui.mode="build"; setHash(); render(); } setTimeout(()=>{ const el=document.getElementById(id); if(!el) return; ui.active=(el.closest("section.layer")||el).id; el.scrollIntoView({behavior:"smooth",block:"start"}); },30); }
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="schoolName"){ state.meta.schoolName=t.value; markDirty(); return; }
  if(t.id==="planYear"){ state.meta.year=t.value; markDirty(); return; }
  const p=t.dataset&&t.dataset.b; if(!p||t.type==="checkbox"||t.tagName==="SELECT") return;
  set(p,t.value); if(t.tagName==="TEXTAREA") autoGrow(t); markDirty();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.hasAttribute&&t.hasAttribute("data-navsec")){ goSection(t.value); return; }
  if(t.hasAttribute&&t.hasAttribute("data-navlens")){ setMode("view",t.value); return; }
  const p=t.dataset&&t.dataset.b; if(!p) return;
  set(p,t.type==="checkbox"?t.checked:t.value);
  if(p.endsWith(".anchorType")) set(p.replace(/anchorType$/,"anchorArea"),"");
  markDirty(); if(t.hasAttribute("data-rr")) render(true);
});
document.addEventListener("toggle",e=>{
  const d=e.target; if(d.tagName!=="DETAILS") return;
  $$("textarea.inp",d).forEach(autoGrow);
  if(d.dataset.opsx) ui.opsOpen[d.dataset.opsx]=d.open;
},true);

document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("summary")&&t.closest("button")) e.preventDefault();
  const sct=t.closest("[data-scrollto]"); if(sct){ e.preventDefault(); goSection(sct.dataset.scrollto); return; }
  const mb=t.closest("[data-menu]");
  if(mb){ const m=mb.closest(".menu"), open=m.classList.contains("open"); $$(".menu.open").forEach(x=>x.classList.remove("open")); if(!open) m.classList.add("open"); return; }
  if(!t.closest(".dd")) $$(".menu.open").forEach(x=>x.classList.remove("open"));
  const ac=t.closest("[data-act]"); if(ac){ $$(".menu.open").forEach(x=>x.classList.remove("open")); runAct(ac.dataset.act,ac.dataset.v); return; }
  const md=t.closest("button[data-mode],a[data-mode]"); if(md){ e.preventDefault(); setMode(md.dataset.mode); return; }
  const ln=t.closest("[data-lens]"); if(ln){ e.preventDefault(); setMode("view",ln.dataset.lens); return; }
  const lg=t.closest("[data-lensgo]"); if(lg){ e.preventDefault(); setMode("view",lg.dataset.lensgo); return; }
  const gt=t.closest("[data-goto]"); if(gt){ e.preventDefault(); goSection(gt.dataset.goto); return; }
  const rv=t.closest("[data-rev]"); if(rv){ ui.rev=rv.dataset.rev; state.meta.stage=ui.rev; markDirty(); render(true); return; }
  const sv=t.closest("[data-setv]"); if(sv){ set(sv.dataset.setv,sv.dataset.v); markDirty(); render(true); return; }
  const tg=t.closest("[data-tog]"); if(tg){ const arr=get(tg.dataset.tog); if(Array.isArray(arr)){ let v=tg.dataset.v; if(tg.hasAttribute("data-num")) v=+v; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); if(tg.hasAttribute("data-num")) arr.sort(); markDirty(); render(true);} return; }
  const ad=t.closest("[data-add]"); if(ad){ doAdd(ad.dataset.add,ad.dataset.p); return; }
  const dl=t.closest("[data-del]"); if(dl){ doDel(dl.dataset.del); return; }
  const mv=t.closest("[data-mv]"); if(mv){ const w=walk(mv.dataset.mv); if(w&&Array.isArray(w.parent)){ const j=w.key+Number(mv.dataset.d); if(j>=0&&j<w.parent.length){ [w.parent[w.key],w.parent[j]]=[w.parent[j],w.parent[w.key]]; markDirty(); render(true);} } return; }
  const sg=t.closest("[data-sugg]"); if(sg){ const p=sg.dataset.sugg, cur=get(p)||""; if(!cur.includes(sg.dataset.v)){ set(p,(has(cur)?cur.replace(/\s+$/,"")+"\n":"")+sg.dataset.v); markDirty(); render(true);} return; }
});

function doAdd(kind,p){
  let obj;
  if(kind==="extra"){ obj=F.extra(); state.top.extras.push(obj); }
  else if(kind==="tension"){ obj=F.tension(); state.tensions.push(obj); }
  else if(kind==="thrust"){ obj=F.thrust(); state.thrusts.push(obj); }
  else if(kind==="objective"){ obj=F.objective(); state.objectives.push(obj); }
  else if(F[kind]&&p){ const arr=get(p); if(!Array.isArray(arr)) return; obj=F[kind](); arr.push(obj); }
  if(!obj) return;
  if(kind==="experience"){ ui.opsOpen[obj.id]=true; }
  syncTolp(); markDirty(); render(true);
  const el=$(`[data-b*="#${obj.id}."]`); if(el){ el.focus({preventScroll:true}); el.scrollIntoView({block:"center",behavior:"smooth"}); }
}
async function doDel(path){
  const w=walk(path); if(!w||!Array.isArray(w.parent)) return;
  const kind=path.split(".").pop().split("#")[0];
  const big={tensions:"creative tension",thrusts:"strategic thrust",objectives:"strategic objective (and its initiatives and learning experiences)",initiatives:"initiative (and its learning experiences)",experiences:"learning experience"}[kind];
  if(big && !(await ask("Remove this "+big.split(" (")[0]+"?",`This removes the ${big}. You can’t undo this, but you can re-import an exported copy.`,"Remove"))) return;
  const [gone]=w.parent.splice(w.key,1);
  if(kind==="tensions") state.objectives.forEach(o=>o.initiatives.forEach(i=>i.tensionIds=i.tensionIds.filter(id=>id!==gone.id)));
  if(kind==="thrusts") state.objectives.forEach(o=>{ if(o.thrustId===gone.id) o.thrustId=""; });
  if(["a1","a2","a3"].includes(kind)) Object.values(state.tolp).forEach(b=>b.experiences.forEach(x=>x.assumpIds=x.assumpIds.filter(id=>id!==gone.id)));
  syncTolp(); markDirty(); render(true);
}
function rollover(){
  const yr=parseInt(state.meta.year,10)||new Date().getFullYear(), ny=String(yr+1);
  const s=JSON.parse(JSON.stringify(state));
  s.meta.year=ny; s.meta.stage="plan";
  const add=[];
  if(has(s.toc.feedback.end)||has(s.toc.feedback.mid)) add.push(`[Feedback loop, ${yr} year-end review] ${s.toc.feedback.end||s.toc.feedback.mid}`);
  s.tensions.forEach(t=>{ const n=t.rnote.end||t.rnote.mid; if(has(n)) add.push(`[${t.tag||"Tension"}, ${yr} review — ${TSMAP[t.status].label.toLowerCase()}] ${n}`); t.log=t.log||[]; if(has(n)) t.log.push({id:uid(),when:"Year-end review",kind:"status",note:`${yr}: ${n}`}); t.rnote={mid:"",end:""}; });
  if(add.length) s.context.evidence=(has(s.context.evidence)?s.context.evidence.replace(/\s+$/,"")+"\n":"")+add.join("\n");
  LEARN.forEach(d=>{ const r=s.learnRev[d.k]; if(has(r.endEv)) r.baseline=`${yr} year-end: ${r.endEv}`; r.midEv=r.midDec=r.endEv=r.endDec=""; });
  s.objectives.forEach(o=>{ o.initiatives=o.initiatives.filter(i=>!(i.review&&i.review.decision==="stop")); o.initiatives.forEach(i=>i.review={decision:"",note:""}); });
  s.insight={mid:"",end:""}; s.toc.feedback={mid:"",end:""};
  ["a1","a2","a3"].forEach(k=>s.toc[k].forEach(a=>{ a.mid={status:"",note:""}; a.end={status:"",note:""}; }));
  Object.values(s.tolp).forEach(b=>b.experiences.forEach(x=>{ x.status="planned"; x.enactNote=""; x.adjust=""; }));
  return s;
}
async function runAct(a,v){
  if(a==="new"){ if(hasContent()&&!(await ask("Start a new plan?","This clears the plan on screen. A backup is kept — File ▸ Restore the previous plan brings it back.","Start new"))) return; backupPlan(); state=blank(); Store.save(state); ui.mode="build"; render(); window.scrollTo(0,0); toast("New plan started"); }
  else if(a==="restore"){ const b=Store.loadBackup(); if(!b) return toast("No earlier plan to restore"); if(!(await ask("Restore the previous plan?",`This brings back the plan saved before your last import, new plan or roll-forward${b.meta&&b.meta.schoolName?` (${b.meta.schoolName}${b.meta.year?", "+b.meta.year:""})`:""}. The plan on screen is kept as the new backup.`,"Restore"))) return; const cur=JSON.parse(JSON.stringify(state)); loadState(b,"Previous plan restored"); Store.saveBackup(cur); }
  else if(a==="rollover"){ if(!(await ask("Roll forward to next year?","Your direction, context, objectives, Theory of Change and ToLP carry over. Year-end evidence becomes next year’s baselines; the feedback loop and your tension notes are added to the evidence; initiatives marked Stop are retired; implementation notes and reviews are cleared. A copy of this year’s plan (.json) downloads first, for your records.","Roll forward"))) return; doExport(); backupPlan(); ui.rev="mid"; state=normalize(rollover()); Store.save(state); goSection("CTX"); toast(`Plan for ${state.meta.year} started — begin by revisiting your current context`); }
  else if(a==="import") $("#fileInput").click();
  else if(a==="json") doExport();
  else if(a==="docx") downloadDocx();
  else if(a==="print-plan") doPrint("plan");
  else if(a==="print-toc") doPrint("toc");
  else if(a==="print-learn") doPrint("learn");
  else if(a==="print-year") doPrint("year");
  else if(a==="print-tolp") doPrint("tolp");
  else if(a==="print-pack") doPrint("pack");
  else if(a==="print-strategic") doPrint("strategic");
  else if(a==="print-ops") doPrint("ops");
  else if(a==="share") shareWithPDPO();
  else if(a==="surface"){ const t=F.tension(); t.status="emerging"; t.log.push({...F.tlog(),when:ui.rev==="end"?"Year-end review":"Mid-year review",kind:"surfaced",note:""}); state.tensions.push(t); markDirty(); render(true); goSection("ten-"+t.id); toast("New tension added to the current context as Emerging — describe what surfaced"); }
}
function backupPlan(){ if(hasContent()) Store.saveBackup(JSON.parse(JSON.stringify(state))); }
/* another tab saved this plan: take its version rather than overwrite it with ours */
window.addEventListener("storage",e=>{ if(e.key!==KEY||!e.newValue) return; try{ clearTimeout(saveTimer); state=normalize(JSON.parse(e.newValue)); render(true); toast("Updated with changes made in another tab"); }catch(err){} });
function hasContent(){ return has(state.meta.schoolName)||state.tensions.length||state.objectives.length||has(state.top.vision); }
$("#fileInput").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) importFile(f); e.target.value=""; });
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h==="build") setMode("build"); else if(h.startsWith("view")) setMode("view",h.split("/")[1]); });
function syncTopbar(){ const tb=$(".topbar"), mob=$("#mobStep"), R=document.documentElement.style; if(!tb) return;
  const top=getComputedStyle(tb).position==="sticky"?tb.offsetHeight:0, mh=mob&&getComputedStyle(mob).display!=="none"?mob.offsetHeight:0;
  R.setProperty("--tbtop",top+"px"); R.setProperty("--tbh",(top+mh)+"px"); }
let rzT; window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ syncTopbar(); if(ui.mode==="view"&&ui.lens==="toc") mountTocPreview(); $$("#view textarea.inp").forEach(autoGrow); },150); });
window.addEventListener("afterprint",()=>{ $("#printDoc").innerHTML=""; });

(function boot(){
  const saved=Store.load(); if(saved) state=normalize(saved);
  const h=location.hash.slice(1);
  if(h.startsWith("view")){ ui.mode="view"; const l=h.split("/")[1]; if(LENSM[l]) ui.lens=l; }
  ui.rev=state.meta.stage==="end"?"end":"mid";
  if(CONFIG.SHARE_URL) $$("[data-act=share]").forEach(b=>b.hidden=false);
  render(); syncTopbar();
  $("#saveState").textContent=saved?"All changes saved":"";
})();
