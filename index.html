er time. Step 3 : Identify the creative tension The creative tension refers to the productive gap between where the school aspires to be (i.e., vision) and where it currently is (i.e., current reality). Rather than viewing this gap as a deficit to close, it should be understood as the source of focus and energy to drive professional learning and change. At this stage, the SSD’s role is to make these tensions visible and actionable so that it can guide decisions about what professional learning should prioritise. Articulation of creative tensions: why it matters The value of creative tension depends on how clearly both ends are defined. When the vision is vague, it is difficult to know what staff are working towards. When the current reality is loosely described, it is difficult to know what needs to change. As a result, the “tension” becomes diffused and does not meaningfully guide the planning of professional learning. Conversely, clarity at both ends sharpens the tension, providing a strong basis for prioritising and designing meaningful professional learning. How What to look out for Identify alignments in school-level indicators and reports (including LNA and perception data) Where do staff-identified needs align, or not align, with school priorities? Misalignment often signals important tensions. Engage in professional conversations, or interviews with staff Through PLTs, departments, or focus group discussions, Where are teachers confident vs stretched? What practices are inconsistently enacted? What concerns suggest deeper capability gaps? Review practice and outcome data together Identify mismatches between: Intended vs enacted pedagogical practices Desired vs actual student outcomes Articulate key tensions as shared problems of practice Translate insights into clear statements: “We aim to [vision], but currently [reality], resulting in [impact].” Look for statements that are: Specific – grounded in practice Shared – not framed as individual deficits Actionable – pointing to acquirable capabilities Conduct strategic sense-making and review with School Management Team Prioritise the most critical tensions that are: central to school improvement goals significantly impact student learning actionable through professional learning ▸ Example — tap to show Example : From Creative Tensions to Strategic Priorities Mr Arc was a first-year SSD who oversaw professional learning and staff well-being in a mid-sized secondary school of 90 teaching staff. The school’s strategic plan had three thrusts: strengthening student-centred pedagogy, deepening CCE integration, and building staff well-being and professional community. Step 1: Identify alignments in school-level indicators and reports (including LNA and perception data) Mr Arc pulled together all available data before drawing any conclusions. He cross-referenced three sources: the LNA aggregate report from OPAL2.0, the recent SSES results, and the SFEd LoP distribution data from previous year’s internal self-perception survey. 68% of staff nominated “Inquiry-Based Learning (IBL)” as a top LNA priority 54% of staff at ‘Emergent’ or ‘Proficient’ in SFEd e-Pedagogy AoP (self-perception survey) 41% of staff reported satisfaction with “opportunities to collaborate with colleagues” for SSES survey Alignment found: Teachers were independently identifying IBL and e-Pedagogy as learning priorities – which align directly with the school’s thrust on student-centred pedagogy. Misalignment found: CCE appears in the school’s strategic plan as a priority thrust, but only 12% of staff nominated any CCE-related area in the LNA. Mr Arc’s action: He flagged the CCE misalignment as a key tension to investigate further. He noted that the low LNA nomination rate may reflect perception, rather than a genuine lack of need. Step 2: Engage in professional conversations or interviews with staff Mr Arc ran three focus group conversations: one with HODs, one with a cross-department group of experienced teachers and teacher leaders, and one with Beginning Teachers. He used open prompts rather than a fixed script. Focus Group with HODs (6 HODs, 45 min): All HODs reported that their teachers were “trying” new pedagogies but implementation was inconsistent across the department. Three HODs independently named and reiterated the same problem: teachers leave the whole school workshop energised, but reverted to familiar practices within two weeks because there was no structured follow-up. Focus Group with Experienced Teachers & Teacher Leaders ( 8 teachers and 3 Senior Teachers , 45 min): Most felt confident in their subject knowledge and classroom management. When asked about e-Pedagogy, the dominant response was that technology tools were available but they were unsure which ones genuinely improve learning vs which were “just for show”. Several expressed interest in opening up their classrooms for observation, but said it felt uncomfortable to ask a colleague to watch them teach. Focus Group with Beginning Teachers ( 5 B Ts , 30 min): All five BTs said their instructional mentors met with them on a regular basis, but the conversations seemed to be routine and mostly administrative. What they would have preferred was someone who could guide and co-plan a lesson with them and be in the classroom. Regarding CCE, they shared difficulties in making CCE “feel real” outside of timetabled CCE lessons. Mr Arc’s insight: The problem was not that teachers are unwilling to learn, but there was no structure for learning to transfer into practice, and to sustain learning. Step 3 : Review practice and outcome data together Mr Arc gathered some classroom observation evidence (e.g., open classroom insights and needs-based observation notes) fro m the HODs and student performance data from the school’s cockpit. Pedagogical mismatch (in area of e-Pedagogy): HODs noted from the lesson observations that the use of technology in the classroom is predominantly substitutive (e.g., slides replacing whiteboards, online forms replacing paper quizzes). The school’s strategic intent is for technology to transform learning; enabling student creation, collaboration and inquiry. The gap between intended and enacted use was significant. Student outcome mismatch (in area of cognitive well-being): Quality of School Experience (QSE) survey revealed worrying decline in the domains of academic self-efficacy and growth mindset. The school’s desired vision is for students to be self-directed. However, HODs also reported heavy reliance on teacher-directed classroom pedagogy and discourse. Consistent strength (in area of classroom relationships): Both lesson observations and QSE survey (i.e., fostering teacher-student and peer relationships) cohered and demonstrated consistently strong Positive Classroom Culture. This is a strength the school can leverage. Mr Arc’s synthesis: The school’s aspiration is for teachers to facilitate inquiry-based, student-centred learning. The current reality, however, was that the use of technology in teaching was substitutive, and student self-direction remained low. The structural reason was that there was no sustained follow-through after the workshop series on inquiry-based learning. Step 4 : Articulate key tensions as shared problems of practice Mr Arc drafted three creative tension statements, with intentional framing as shared problems – not individual deficits – and ensuring each is specific, actionable, and grounded in evidence. Creative Tension 1: Student-centred Pedagogy (T1) We aim to have teachers consistently facilitate inquiry-based, student-directed learning in which technology transforms how students create and collaborate but currently most classroom technology use i s substitutive (replacing analogue tools rather than changing learning modes), and lesson observation data shows predominantly teacher-directed instruction resulting in students’ declining cognitive well-being (i.e., academic self-efficacy and growth mindset) and confidence in directing their own learning. Creative Tension 2 : Transfer of Staff Learning (T2) We aim to have professional learning translate into sustained changes in classroom practice across all departments but currently there is no structured mechanism for teachers to apply, experiment with, and reflect on new learning after the whole-school PL workshop series resulting in HODs consistently reporting that new practices were adopted briefly, but without follow-through support. Creative Tension 3 : Integration of CCE (T3) We aim to have all teachers to be proficient in integrating CCE values and socio-emotional competencies authentically into the teaching of their subjects but currently only a minor ity of staff identify CCE as a learning priority, and BTs report challenges in making CCE feel authentic outside designated lessons resulting in CCE remaining a siloed responsibility rather than a whole-school pedagogical commitment and approach. Why the format matters: Each statement grounds the tension by naming a specific vision, a specific current state grounded in data, and a specific impact. This prevents the tension from becoming vague or abstract, and makes it possible to design professional learning that addresses the actual gap — not just the symptom. Step 5 : Conduct strategic sense-making and review with School Management Team Mr Arc presented the three problems of practice to the School Management Team during Management Meeting. The session was structured around three prioritisation questions. Prioritisation Question 1: Which of these tensions is most central to the school’s improvement goals in this current cycle? Landing Point: Addressing T1 is most direct expression of this cycle’s improvement goals and the most visible to students. T2 is the structural pre-requisite without which T1 cannot shift – the two are inseparable and must be addressed together. T3, while strategically important, requires a culture and perception shift that a single cycle of PL cannot shortcut. Prioritisation Question 2: Which has the greatest impact on student learning if left unaddressed? Landing Point: T2 has the greatest systemic impact if left unaddressed – it is a structural leak that makes all other PL investment ineffective; while T1 has the most direct and compounding impact on students’ learning and well-being. The case for addressing both simultaneously is stronger than the case for either alone. Prioritisation Question 3: Which is most actionable through professional learning? Landing Point: T1 and T2 are fully actionable through professional learning this cycle, and are best designed as one integrated initiative. T3 is not yet fully actionable, but the PL structures built for T1 and T2 will begin creating those conditions, making T3 genuinely actionable in a subsequent cycle. Mr Arc then proposed the following phased approach, and garnered the support and ownership of the School Management Team. Phase / Timeline Priority Action Foundation and trust-building (2025 – 2026) Build PLT cycles, open classroom / structured peer learning routines, and 3A debriefs Deepening classroom practice (2026) Use the established PLT and open classroom routines to deepen transformative e-Pedagogy and inquiry-based facilitation, connecting classroom evidence to student agency and cognitive well-being. Extending into CCE (2027 onwards) Leverage the same collaborative structures and shared professional language to integrate CCE as a whole-school pedagogical commitment. This is an extension of the established inquiry culture. What Mr Arc has now, and why the process matters: Three co-owned, sequenced priorities grounded in what students are experiencing in the classrooms, what structural conditions must exist, and what the school can realistically sustain. The shared sense-making and reasoning makes the ensuing Total Learning Plan a commitment for the team. With clearly articulated creative tensions, the focus of professional learning becomes sharper and more purposeful. Rather than designing programmes based on broad topics or ad hoc needs, SSDs can now anchor their planning in specific problems of practice that matter to the school. The next step is to translate these prioritised tensions into intentional professional learning experiences – ones that are aligned to school goals, responsive to staff needs, and designed to support meaningful changes in practice."}, {"id": "p3.0", "part": "p3", "title": "Part 3 — Designing Professional Learning Experiences", "text": "With the strategic context established and staff learning needs mapped in Part 2 , t his part brings together practical frameworks and principles for designing and implementing professional learning experiences. The focus shift s from determining what the school should prioritise, to shaping the learning architecture that will support teacher growth. Part 3 therefore focuses on the design of professional learning experiences: how staff learning is structured, differentiated, sequenced and supported, so that teachers have meaningful opportunities to build capability, strengthen confidence and apply learning in practice. At a Glance: Designing Learning Experiences within the Total Learning Plan Part 3 focuses on the ‘ Implement’ phase of the Professional Learning cycle , with emphasis on the design of professional learning experiences . It guides SSDs to translate professional learning priorities into coherent learning experiences within the Total Learning Plan. At this stage, SSDs make design decisions on how teachers will learn, what modes and structures will best support that learning, and how learning can be connected to practice . This includes: applying adult learning principles and Design Principles for Effective Professional Learning to shape purposeful and context-responsive professional learning , using the A-R-C Learning Model and B lended P rofessional L earning considerations to sequence learning across experiences, relationships and modalities, and leveraging structures and conditions (e.g., P rofessional Learning Communities , Instructional Mentoring, and staff well-being considerations ) to support practice-oriented growth and transfer"}, {"id": "3.1", "part": "p3", "title": "Understanding the Learner: Adult Learning Principles as the Foundation", "text": "Effective professional learning design begins with a clear understanding of the learner. Teachers are adult learners — experienced professionals with established beliefs, prior knowledge, and may have varying professional roles and responsibilities. These factors shape not only what they learn, but whether new learning is taken up and sustained in practice. Malcolm Knowles outlines six principles of adult learning that shed light on how adults engage with learning. Together, these principles offer a foundation for thinking about how professional learning can better support teachers. Principles Description Implications Need to know Adults need to understand the purpose and value of what they are learning, especially given competing demands on their time. Make the “why” explicit; Clearly link learning to school priorities, classroom practice, and student outcomes. Readiness to Learn Adults are more ready to learn when content is relevant to their current roles, challenges, and goals. Anchor learning in current school priorities and teachers’ immediate needs. Use data (e.g., LNA, observations) to ensure relevance. Learner’s Self-Concept Adults see themselves as self-directed and value autonomy in their learning. Provide choice and flexibility (e.g., micro-learning, differentiated pathways); Encourage ownership of learning goals. Orientation to Learning Adults are problem-centred and want learning that helps them address real challenges. Design around authentic problems of practice. Use scenarios, cases, and practice-oriented tasks. Role of Learner’s Experience Adults bring prior experience that can support or shape new learning. Leverage peer sharing, collaborative inquiry, and reflection on practice; Treat teachers as contributors, not just recipients. Motivation Adults are primarily driven by intrinsic motivation (e.g., improving practice, student impact). Connect learning to purpose and professional growth; Reduce barriers and support sustained engagement over time. How adult learning principles connect to TOTL As self-determined adult learners, our teachers appreciate learner agency, supportive learning environments, and active learning experiences. Agency: Our educators are driven by a sense of mission and take ownership of their professional learning Learning Environment: Our leaders prioritise and champion professional learning by actively creating and sustaining a learning culture that meets learners’ need. Learning: Adult learners construct knowledge actively and with their peers, as learning is informed through socialisation and cultural cues."}, {"id": "3.2", "part": "p3", "title": "Design Principles for Effective Professional Learning", "text": "The Design Principles for Effective Professional Learning articulates the attributes of effective professional learning to guide professional learning designers in designing intentional learning experiences for adult learners. It guides the conceptualisation, implementation and review of professional learning. Tip: 10 Questions for Design of Effective Professional Learning Experiences"}, {"id": "3.3", "part": "p3", "title": "A-R-C Learning Model", "text": "The A-R-C Learning Model articulates that there is a broad spectrum of professional learning experiences, consisting of both formal and informal learning experiences, ranging from developmental assignments (A), to relationships (R), and courses (C). It positions adult learners as drivers of their learning where they set goals and shape their own learning processes and opportunities. Tip: U sing the A-R-C Learning Model as a whole-school approach to sustain learning Use the A-R-C Learning Model to design differentiated learning pathways for the identified professional learning prior ity . For example, for the focus on SFEd Area of Practice on Inquiry-based Learning (IBL) , Teachers moving towards ‘Proficient’ may benefit from structured courses, lesson enactment opportunities and collaboration with mentors or PLTs. Teachers moving towards ‘Accomplished’ or ‘Leading’ may deepen their practice through networks, lead professional learning for others, and contribute back to the department, school, or fraternity. There is no fixed sequence for learning experiences . What matters is that the learning experiences are deliberately combined and matched to teachers’ readiness, roles and growth needs, so that learning is applied in practice, supported by others, and sustained over time."}, {"id": "3.4", "part": "p3", "title": "Blended Professional Learning", "text": "To optimise opportunities for active learning and co-construction of knowledge to address professional learning needs, different elements of professional learning can be meaningfully integrated. The diagram below illustrates examples of learning activities across the asynchronous/synchronous and online/in-person spectrum to better harness the affordances of blended professional learning. Tip: Decision Matrix for the type of blended PL activity You may use this Decision Matrix to determine the type of blended professional learning activity that could be designed (i.e., in-person, online asynchronous or online synchronous)."}, {"id": "3.5", "part": "p3", "title": "Professional Learning Communities", "text": "Professional Learning Communities (PLCs) are one of the most powerful levers available to SSDs — not as a programme to design and deliver, but as a school-wide culture of collaborative inquiry that, when functioning well, becomes self-sustaining. What is a PLC? A PLC is a platform to foster a culture of professional excellence in schools across the system. PLC helps educators learn how to improve student outcomes in a systematic, timely, and holistic manner and enhance their own professional development. It is anchored on three big ideas and four critical questions: 3 Big Ideas 4 Critical Questions 1. Ensuring Students Learn PLCs are formed with the intention of ensuring student learning, actively tracking learning progress, and problem-solving when learning is compromised. 2. Building a Culture of Collaboration PLCs are about teachers working and thinking collaboratively to create a sense of shared purpose in schools. 3. Focusing on Student Outcomes PLCs examine the outcomes of their projects and work towards refining methods to achieve goals. The Five Dimensions of an Effective PLC The five dimensions for effective PLCs provide a holistic picture of the PLC processes and actions that schools may take to achieve the outcomes of the 3 Big Ideas. Dimension What it may look like in practice SSD’s enabling role Shared and Supportive Leadership (SSL) School Leaders, Professional Learning Team (PLT) leaders and members share power, authority and decision-making while promoting and nurturing leadership. Adopt a bottom-up approach Promote shared leadership Consider staff feedback Provide ample support Establish broad directions for PLC Regular discussions Provide input Provide autonomy Incorporate staff’s input for decision-making Nurture leadership Shared Values and Vision (SVV) PLTs share values and vision that support and guide decisions about teaching and learning with a focus on staff and student learning. Align values and vision Provide clarity Share ownership Emphasis student and staff learning Share broad directions Ensure alignment Induct new staff Reiterate the developmental nature of PLC and the emphasis on staff and student learning Collective Learning and Application (CLA) PLTs share information and work collaboratively to plan, address teaching and learning challenges, and improve learning opportunities for both staff and students. Collaborate effectively Be a learner Explore collaborative inquiry methods Use research to inform practice Strengthen the theory-practice nexus Build staff capacity in inquiry Encourage collaboration within PLC Establish expectations on data-driven conversations Encourage reflection Shared Personal Practice (SPP) Peers meet and observe one another to provide feedback on pedagogical practices, to assist in student learning and to increase professional capital. Foster a culture of collaboration Deprivatise classroom Create structured mentoring practices Focus on learning process Establish an open classroom culture Establish mentoring within PLC Provide platforms for sharing Encourage reflection Supportive Conditions – Relationships (SCRel) Positive, caring relationships based on respect, trust and norms of critical inquiry and improvement support a culture of collegiality. Establish a positive and caring community Build partnerships with other schools Encourage innovation and risk-taking Recognise efforts and not just outcomes Establish a system to monitor PLTs’ progress Establish clear timelines Provide resources Provide protected time Establish a support system Provide templates Provide platforms for sharing Streamline initiatives Provide platforms to sustain learning from PLC Supportive Conditions – Structures (SCStruc) Structures include systems and resources to enable staff to meet and examine practices, and deliver staff and student outcomes. Set aside time for PLT meetings Provide wider access to internal and external expertise Provide flexibility to go beyond the calendar year Scale up effective practices Recognise and celebrate learning Link PLT to internal and external expertise Build capacity and professional capital Using the PLC Developmental Rubrics (PLCDR) as a strategic planning and review tool The PLCDR includes key descriptors of the five dimensions for effective PLCs across three stages of development (i.e., initiating, implementing, and sustaining). This instrument enables SSDs to assess the state PLC implementation of the school by gathering staff’s perceptions. Once they have identified the stage of development of the PLC based on each dimension, SSDs can facilitate deeper conversations with the School Management Team, aimed at moving their PLC to the next stage of development. How to use the PLCDR When to Administer Administer the PLCDR towards the end of the project cycle, typically in late October, with Education Officers across varying staff profiles (i.e., Middle Managers, Teacher Leaders, Experienced Teachers, and Beginning Teachers). Identifying Developmental Priorities Identify one to two dimensions at the Initiating or Implementing stages as PLC developmental priorities. Planning for the Next Cycle Use the PLCDR findings to inform the design of the Total Learning Plan for the following year's/cycle's implementation. Reviewing Impact Consider the PLCDR findings as evidence to support the review of professional learning impact, connecting the development of the identified dimension(s) to student or staff outcome measures. This may be done during mid-year and year-end reviews at Management Meetings."}, {"id": "3.6", "part": "p3", "title": "Instructional Mentoring", "text": "Instructional mentoring is a developmental and mutually beneficial partnership which supports teachers’ professional growth in teaching and learning, while also nurturing teacher well-being. Instructional Mentors (IMs) support teachers in teaching and learning, with the aim of continually enhancing their pedagogical skills and practice to enable high-quality teaching and learning experiences. Instructional mentoring is a professional learning enabler for all teachers, at all career stages (i.e., both Beginning Teachers and Experienced Teachers), where professional growth is fostered through the cultivation of developmental relationships between mentor and mentee. What is Singapore Instructional Mentoring Approach (SIMA) ? The Singapore Instructional Mentoring Approach (SIMA) articulates our vision and mission of instructional mentoring practice in schools, and outlines the essential elements of instructional mentoring. SIMA emphasises three focus areas that are central to creating a quality instructional mentoring experience that will be valued and sought by all, namely, Relationship Building, Promoting Mutual Growth, and Localising Mentoring. Creating conditions for Instructional Mentoring to thrive Effective instructional mentoring does not happen by assignment – it requires deliberate structures and sustained investment. The SSD partners the Coordinating Instructional Mentor (CIM) in fostering a vibrant mentoring culture in school. The CIM serves as both the Champion of Instructional Mentoring and Leader of IM Professional Learning and Practice. Schools should consider appointing an experienced IM as the CIM, preferably a Teacher Leader, given their dual role as pedagogical leader and IM which makes them well-suited to model, lead, and develop IMs. The SSD provides the CIM with strong support in establishing the necessary structures and processes, with support from School Leaders, for instructional mentoring to take place in the school. Area Structures and Processes What SSDs can do to support CIMs Deployment Well-considered IM-mentee pairings Draw on LNA responses and conversations with Reporting Officers to identify each mentee’s specific growth focus, and map against the IM’s pedagogical strengths Workload of IMs Work with School Management team to manage IM’s workload and adjust the depth of involvement in other duties Building the IM team Develop an IM succession pipeline in collaboration with CIM (e.g., identify aspiring IMs early, opportunities to observe experienced IMs) Support School Leaders in nominating aspiring IMs for the Instructional Mentoring Programme (IMP) Staff Engagement Clear communication of intent and alignment of expectations for IMs and mentees Work with CIM to address stigma proactively to frame mentoring as professional learning for all who are keen, and conduct open call at Staff Contact Time Together with CIM, run structured onboarding for new IMs and mentees Instructional Mentoring Practice Protected time for instructional mentoring Coordinate with the Timetabling team early to secure these protected timetable slots between the IM-mentee pairings Monitor and review impact Support CIM in gathering and analysing data from staff to monitor and review impact of instructional mentoring efforts Professional Learning of the School IM team Regular platform for IMs to share and learn together Establish bi-weekly, monthly or termly CIM-facilitated IM team sessions that focus on professional growth of IMs Prioritisation of IMs' continued growth Work with CIM to differentiate development across the IM team (e.g., newer IMs need more scaffolded support in mentoring conversations, experienced IMs with stretch assignments)"}, {"id": "3.7", "part": "p3", "title": "Championing Staff Well-being", "text": "As a Promoter of Staff Well-being, your role is to support your school leaders in fostering a culture where staff feel heard, valued and supported. This involves creating psychologically safe spaces and driving initiatives that are responsive to staff needs. Well-being must be woven into the fabric of their daily professional experiences. A useful lens for this work is the SPICE framework, which underpins MOE OLive's integrated approach to staff well-being. By attending to the Social, Physical, Intellectual, Community and Emotional dimensions of staff development, you enable staff to achieve well-being across different aspects of their lives at work, at home and in the wider community. Professional learning, in particular, should be designed with well-being in mind. This involves building agency, strengthening peer support, and affirming their sense of professional identity. In doing so, staff are energised, encouraged and enabled to connect with their sense of purpose to sustain their professional commitment. How does Professional Learning contribute to Staff Well-being – and why it matters Professional learning builds confidence and capabilities — and in doing so, it nurtures the very foundations of their well-being. OECD (2025) points to three inner anchors that sustain teachers through the demands of their work: Being (an authentic sense of self grounded in professional identity and purpose), Belonging (feeling valued and empowered to contribute meaningfully, with supportive collegial relationships), and Becoming (a growth orientation that embraces lifelong learning and reflective practice, and sees challenges as opportunities). Effective professional learning, when thoughtfully designed, speaks directly to all three. This is why the SSD's role as designer of professional learning and promoter of staff well-being are both expressions of the same commitment to teacher flourishing. SSD’s Role in Staff Well-being Grounded in the three inner anchors, SSDs support teacher well-being through three distinct actions: Action What this means in practice Enable sense-making Help staff interpret new information, challenges and initiatives meaningfully (i.e., connecting them to their professional identity and school direction, rather than leaving them to absorb change in isolation), which transform everyday challenges into opportunities for growth and innovation. Surface creative tensions as shared professional problems of practice, not individual shortcomings. Strengthen agency Create genuine opportunities for staff to have a say in their own professional learning and in the decisions that shape their school. This means enabling staff to co-design and take ownership over their own growth. Enhanc e psychological safety Promote respectful and authentic dialogue where staff feel comfortable sharing what they need, what is getting in the way, and what support would genuinely help). Normalise vulnerability, where peer observation is welcomed, admitting uncertainty is seen as professional strength, and mistakes are part of learning. This means being intentional about how PL experiences, PLTs, mentoring structures, and learning cultures are designed. Four S trategies for C hampioning S taff W ell-being SSDs draw on four strategies to build and sustain a well-being culture across the school. These strategies are mutually reinforcing, and the emphasis on each will shift depending on the school's context and the needs of staff at any given time. What matters is that each strategy is approached intentionally rather than reactively. Strategy What SSDs do Adopt a needs-based approach Disaggregate SSES data and other school-based survey findings by staff segment (i. e., EO/EAS, KP/non-KP, years-in-service ), to identify where support is most needed. Triangulate survey data with proxy indicators (e.g., patterns in sick leave, absenteeism, and engagement in non-mandatory activities) Share these findings with the School Management Team during the planning of Total Learning Plan Cultivate a positive school culture Role model psychological safety through the practice of selective vulnerability (e.g., sharing your own professional uncertainties and how you navigate them) Embed well-being check-ins into existing structures (e.g., staff contact time, or touchpoints) Equip School Management Team and Teacher Leaders to build psychological safety at department level Design PL experiences that embody the culture (e.g., having the autonomy and agency, to be willing to experiment without fear of failure) Champion social-emotional professional learning Build the capability of School Management Team and Teacher Leaders to recognise early signs of distress and refer with care Brief Reporting Officers on how they can guide their job-holders to develop social-emotional strengths during their developmental conversations, connecting it to the broader Teacher Growth Model Learning Dimension 2 on Fostering Well-being Encourage peer support Promote Let’s Chat as a provision for teachers seeking peer support. These small group sessions offer a confidential, safe space for teachers to share personal stories and gain diverse perspectives from the school community. Promote Wellness Ambassadors as a visible peer support network (i.e., identify, support and recognise their contribution within the school’s PL and well-being culture) Use Generative Discussion in school-based Ethos conversation as a structured space for collective reflection, building collegial resilience Building a Peer Support Culture through Let’s CHAT The SSD's well-being mandate is ultimately one that is meant to impact organisational culture — not to hold every conversation personally, but to build the conditions in which empathic and psychologically safe conversations happen naturally across the school, at every level: between colleagues , between School Management and their teams, between School Leaders and staff. The goal is a school where everyone has someone looking out for them — and where that care is distributed across multiple connectors in the system, not concentrated in a single role. Let’s Chat is a practical tool that SSDs can proliferate across these connectors, equipping them to hold conversations with structure, care, and purpose. What is Let’s CHAT? Let’s CHAT is MOE’s structured peer support approach , designed by iCARE counsellors . CHAT stands for C ome together, H elp and be H elped, A ppreciate Each Other , T ake action . It provides a safe and guided space for staff to come together, share personal experiences, offer mutual support and leave with personal insights or possible next steps. The facilitation methodology consists of different phases: Connect Build rapport and psychological safety Establish shared norms and expectations Reflect Identify focus are or opportunities for growth Share & Support Explore perspectives and insights Appreciate & Close Consolidate learning and end with gratitude As there is a facilitation methodology behind Let’s CHAT, schools interested in adopting/adapting should approach the iCARE counsellors for guidance. With appropriate guidance, schools may use Let’s CHAT to strengthen peer support for everyday professional concerns (e.g., navigating workload pressures, adjusting to change, strengthening collegial relationships, or making sense of common workplace experiences). I n such cases, the SSD’s role is to coordinate, encourage participation, and work with trained facilitators to create safe conditions for dialogue. SSDs can draw on Let’s CHAT flexibly across different school contexts: Refer staff to iCARE-facilitated Let’s CHAT sessions when they would benefit from a structured peer support space, Work with iCARE team to build school-based facilitation capability, where appropriate, so that trained staff can facilitate collaborative peer support conversations, and Strengthen peer support norms within existing school structures (e.g., staff check-ins, PLTs, or department conversations), while keeping clear boundaries between peer support and counselling. Note : Let's CHAT is peer support — not counselling, and should never be positioned as a substitute for professional help , or for serious cases involving significant distress, risk or complex personal concerns . Where a staff member's needs go beyond what peer dialogue can address, refer them with care to the appropriate tier of support. MOE’s Tiered System of Support Fostering a professional learning culture in which teachers' well-being is genuinely prioritised is the SSD's ongoing commitment — but it does not mean carrying every concern alone. When a teacher's needs go beyond what peer support or the school environment can address, SSDs need to know the broader support ecosystem well enough to refer decisively and with care. When SSDs know this ecosystem well — and use it with confidence — they complete the picture of what it means to champion staff well-being: designing professional learning that builds teachers from within, cultivating the peer structures that ensure no one navigates challenges alone, and knowing when and how to connect colleagues to the support they need beyond the school. Professional learning that is well-designed but poorly sustained will not change practice. The frameworks in this part (i.e., Design Principles for Effective PL, A-R-C Learning Model, Blended Learning, PLC, Instructional mentoring, and the conditions for staff well-being) are not separate tools to be applied in isolation. They form a coherent design system: one that attends to how teachers learn, through what structures and relationships, and within what kind of professional climate. When these elements work together, they create the conditions for teachers to feel equipped, connected, and purposeful enough to keep growing. What remains is the leadership challenge: guiding people through the change that good design makes possible, and building the reflective habits that allow learning to deepen and sustain. The next part addresses both – leading change deliberately, and building the reflective habits that allow learning to deepen and hold."}, {"id": "p4.0", "part": "p4", "title": "Part 4 — Leading Change and Deepening Learning", "text": "Good professional learning design is necessary , but not sufficient. The gap between a well-designed professional learning experience to lasting changes in classroom practice is almost always a people and implementation challenge: building the will and confidence to engage, navigating concerns and resistance, and giving learning the space to consolidate into sustained practice . Part 4 focuses on this leadership work , and equips SSDs to partner School Management Team to lead enactment using deliberate change leadership to build ownership and momentum, and structured reflection to help teachers deepen, adapt and embed their learning over time. At a Glance: Leading Change and Deepening Learning Part 4 continues the ‘ Implement ’ phase of the Professional Learning cycle , with emphasis on leading implementation and deepening learning . While Part 3 focuses on designing professional learning experiences, Part 4 focuses on what helps those experiences gain traction and translate into sustained changes in practice. At this stage, SSDs consider how changes should be led, how stakeholders can be mobilised, and how reflection can be built into enactment. This includes: applying Kotter’s 8-Step Change Model to build ownership, address barriers and sustain momentum, working with School Leaders, School Management Team and Teacher Leaders to strengthen enabling conditions for enactment , and using the 3A Reflection Approach and 3S Professional Learning Strategies to deepen reflection, support transfer and refine practice over time."}, {"id": "4.1", "part": "p4", "title": "Leading Change with Kotter’s 8-Step Change Model", "text": "The quality of implementation determines whether good design produces real change. Professional learning initiatives stall not because content fails to resonate, but because change is difficult — teachers may understand what is being asked of them but not yet feel capable, or feel capable but lose momentum when initial support is withdrawn. Kotter's 8-Step Change Model gives SSDs a proactive, sequenced framework for leading the human side of implementation: building the conditions for adoption before resistance builds, sustaining momentum through the harder middle stages, and institutionalising change so it outlasts any individual's advocacy. Moreover, SSDs may leverage Teacher Leaders to drive both pedagogical leadership and implementation success. As champions, early adopters and peer supporters, Teacher Leaders provide the instructional expertise and change leadership needed throughout the Kotter’s 8-step process to accelerate adoption and build sustainable momentum. Stage What SSDs do How can Teacher Leaders support Create a sense of urgency Present classroom practice evidence (e.g., open classroom insights, needs-based observation findings), student survey findings, and the shared problems of practice to make the cost of inaction personal and concrete Frame this as a shared professional challenge, not a management directive Articulate urgency from a practitioner’s voice (e.g., the sharing by two or three TLs on what they have observed in their own classrooms would carry more weight with peers) Build a guiding coalition Before any whole-school communication, identify 3-5 Teacher Leaders and HODs who are genuinely committed Brief them deeply: share the evidence, hear their concerns, and give them space to shape the approach Form the core of the coalition, and be advocates who have reasoned their way to commitment Form a strategic vision Co-create a specific, observable vision of success (e.g., “by term 3, 50% of observed lessons show students driving inquiry, with teacher as facilitator”) Make it concrete enough to observe, measure, and use in developmental conversations Translate the vision into classroom-level language that resonates with colleagues (e.g., a worked example in a specific subject) Enlist a volunteer army Communicate the vision widely through department meetings, management conversations, and peer sharing – so that ownership spreads beyond the guiding coalition Invite colleagues to join; teachers who choose to engage carry the change further Champion the vision in their departments – sharing their own experience of the change honestly, including what they are still figuring out, to invite colleagues in rather than instruct them Enable action by removing barriers Identify structural obstacles (e.g., timetabling, resource access, absence of peer observation protocols) Raise these with School Leaders with specific proposals Flag ground-level barriers early Generate easy wins Design early, visible successes into the plan (e.g., Semester 1 TL lesson showcase, PLT early outcomes shared at Staff Contact Time, and spot observation data showing positive movement) Use early wins to demonstrate that the change is achievable, not just aspirational Be the subject of early wins – volunteer to share practice, lead a lesson demonstration, present a brief honest account of what changed and what they are still learning Increase the pace Use mid-year/cycle review data to sharpen and accelerate Build on early wins (e.g., expand peer observation pairs, bring in IMs to support lesson confident teachers, deepen PLT debriefs using the 3A reflection approach) Resist the pull to declare victory early or pivot to a new initiative Move from early adopters to co-facilitators of PLT cycles and eventually, coaching colleagues who are still developing the new practice Institute change Embed new practices into school systems (e.g., update classroom observation and open classroom protocols , incorporate PLT reflections into developmental conversation, recognise sustained practice change at the Learning Festival) Change is institutionalised when it no longer depends on SSD’s advocacy to survive Model sustained practice (e.g., TLs’ classrooms become the reference point for the new norm) Bring newer teachers into the embedded practice through mentoring and open classroom ▸ Example — tap to show Example: Leading a whole-school shift towards inquiry-based, student-centred learning The Challenge Classroom practice evidence gathered through open classrooms and needs-based observations suggests 78% of lessons are teacher-directed. At the last year’s QSE survey, the school received 63% for the indicator on academic self-efficacy , against a national average of 76%. Furthermore, the IBL workshop series was well-attended but produced no measured change in classroom practice. The SSD recognises that the problem is not the content of the PL, but the absence of the conditions needed for change to adopted and sustained. The Kotter’s Approach Create a sense of urgency : The SSD presented classroom practice evidence and the QSE Self-efficacy gap to establish the evidence base. She then asked the four TLs: \"What were you seeing in your own classrooms?\" Their firsthand accounts grounded the data in lived professional reality — and it was their voices, not the SSD's slides, that made the urgency land with peers. Build a guiding coalition : The SSD met each TL individually to hear their concerns and co-shape the approach. Together, they agreed: each TL would trial one inquiry-based lesson before the whole-staff launch, so they spoke from experience when they championed the initiative. The coalition was built on shared conviction, not assignment. Form a strategic vision : The SSD and TLs co-created a specific, observable vision: \"By Term 3, in 50% of lesson observations (e.g., open classrooms or needs-based observation), students would be the primary questioners and knowledge-constructors.\" Each TL helped to translate this into what it would look like in their subject — so the vision would arrive at departments already contextualised, not abstract. Enlist a volunteer army : Each TL presented at their department's Term 1 meeting — sharing their trial lesson honestly: what worked, what surprised them, what they were still figuring out. Colleagues who were curious are invited to join a peer observation pair. Within two weeks, 18 teachers across six departments have opted in — because a trusted colleague made the change feel possible. Enable action by removing barriers : Joint SSD–TL conversations surfaced two obstacles: teachers could not connect IBL to their subject context, and there was no protected time for peer observation debrief. Each TL co-developed a subject-specific IBL design guide with their department. The SSD proposed fortnightly open observation periods to the School Leaders — with TLs providing the classroom evidence that would make the case compelling. Both were approved by end of Term 1. Generate easy wins : Two TLs presented at a Term 2’s Staff Contact Time — not a polished showcase, but a candid account of what changed, what students said, and what they would do differently. A third TL quietly invited three skeptical colleagues to observe her next lesson. The SSD shared spot observation data showing 28% of lessons with student-led inquiry — up from near zero. The army grows. Increase the pace : Mid-year review showed application were at 28%, which was still below target. The IMs paired with less confident teachers for co-planning sessions. TLs took on a new role: co-facilitating PLT debriefs using the 3A reflection approach, shifting conversation from what was taught to what students experienced. The initiative deepened — and TLs are now leading that deepening, not just modelling it. Institute change : The SSD updated classroom observation and open classroom protocols to include student inquiry indicators. At the Learning Festival , TLs designed and led student-centred showcases — making the new norm visible to the whole school. Two TLs were nominated to mentor incoming teachers on IBL practice. The change no longer depends on the SSD — it lives in the people and systems of the school. The Result By year-end, 47% of reviewed lessons showed evidence of the inquiry practices the school had prioritised— a substan tial shift from the near-zero baseline. More significantly, the practice is self-sustaining: Teacher Leaders are mentoring peers and lesson observation frameworks have been updated. What began as an SSD-led initiative has become a school-owned professional norm — and that is the measure of success."}, {"id": "4.2", "part": "p4", "title": "Deepening Learning through Reflection", "text": "Change leadership accelerates adoption. Reflection is what makes adoption become genuine professional growth. Without structured space to pause, interpret, and integrate what has been experienced, teachers may go through the motions of new practice without developing the understanding that allows them to adapt and sustain it over time. It is important to build reflection intentionally into professional learning experiences. Structured reflection protocols support both individual development and collaborative learning within your professional learning design. 3A Reflection Approach The 3A Reflection Approach (i.e., Awareness-Alternatives-Action) makes the process of quality teacher reflection visible and gives SSDs, School Management, TLs, IMs, and PLT leaders a shared language and common structure to deepen learning across the school. Process Focus Guiding Questions What happened? (Awareness) Understanding personal beliefs, mental models, knowledge bases, assumptions and impact on others. What was expected? What was unexpected / puzzling? What made it expected / unexpected? What did I think / feel / want / do? What do these reveal about my assumptions and habits, and are they aligned with my goals and beliefs? What did my students (or colleagues / stakeholders) think / feel / want / do? Have my students learnt and how do I know? What insights did I gain about my students / colleagues / stakeholders? Why did I find these observations significant? So what? (Alternatives) Formulating and evaluating alternative ways of thinking / courses of action in dialogue with everyday contexts of practice (A), knowledgeable others (R) and courses / resources (C). Who (i.e., resource person / mentor) or what resources can I consult for alternative perspectives / to clarify my blind spots? Are alternative ways of thinking / acting backed by research or new information? Are they aligned with my beliefs, goals and identity? (for ways of thinking) What are their implications for action / how I relate to others? How will I know if they are valid? (for actions) What would I need to do to enact them effectively? How will I know if they have worked? Now what? (Action) Experimenting with/ trying out alternatives through job-embedded actions. What alternative actions should I take? Are they aligned with my beliefs, professional roles, goals and desired student / organisational outcomes? How can I improve my awareness of my practice? 3S Professional Learning Strategies The 3S PL Strategies (i.e., Scaffold-Stimulate-Support) translate the 3A Reflection approach into PL design, guiding SSDs in building the conditions for reflection intentionally into professional learning experiences, rather than leaving it to chance. Process How Make the reflection process visible by raising awareness of the 3As (Scaffold) Share 3A reflection approach as a thinking routine, and help learners internalise the process. Design reflection prompts based on the 3A guiding questions. Role model reflection during the PL experience. Convey that reflection is a process, rather than the product. Incorporate reflective processes throughout – and not only at the end – of PL experiences. Enable learners to reflect through different mediums and activities (e.g., discussion and recordings, in addition to writing). Focus on learners’ quality of thought rather than reflection artefacts when providing feedback. Design PL to facilitate thinking on the 3A guiding questions (Stimulate) Create opportunities for learners to clarify, examine and challenge their beliefs in a non-judgmental and low-stakes setting. Curate a series of belief statements related to the learning area and invite learners to rate their agreement with them. Belief statements should have no clear right or wrong answer as far as possible. Invite learners to share their beliefs with others. Recognising that others hold different, but equally acceptable, beliefs may prompt learners to reflect on their own beliefs. Share possible strategies to improve awareness of practice and enable learners to design their own reflection plans. Possible strategies include journalling or making notes on one’s lesson, video-taping and reviewing one’s teaching, peer lesson observations etc. Acknowledge learners’ potential concerns (e.g., time commitment, difficulty in being vulnerable) and encourage learners to start small (e.g., adopting a simpler strategy / focus on one class or one teaching action). Provide learners with time, space and an enabling environment to reflect (Support) Provide learners with time and space for reflection. Review balance between received knowledge (i.e., content delivery) and reflection during formal PL experiences (e.g., workshops, PLTs). Create an environment that encourages autonomy, openness, curiosity, willingness to experiment and collective learning. Sharing of reflection should take place in low-stakes, developmental setting. Avoid formal evaluation of reflection. Encourage a growth mindset by reiterating that reflection focuses on understanding practice, rather than pinpointing problems and weaknesses. Design PL to foster sustained relationship building. Recognise informal and localised networks as critical friends to interrupt habitual thinking and practice."}, {"id": "p5.0", "part": "p5", "title": "Part 5 — Measuring Success and Impact", "text": "Professional learning without evaluation is planning without feedback. The r evie w process completes and renews the cycle, connecting what was intended, what was designed, what was enacted, what teachers experienced and learnt, and whether professional learning contributed to shifts in practice and intended outcomes. This part equips SSDs to build that feedback loop deliberately: by making the school’s professional learning logic explicit through a T heory of C hange , using the LEARN Compendium to examine evidence at both whole-school and programme levels, and making specific, evidence-based decisions at mid-year and year-end on what to continue, adjust, deepen, or stop. At a Glance: Reviewing Impact and Feeding Forward Part 5 focuses on the ‘ Review ’ phase of the Professional Learning cycle . It guides SSDs to examine whether professional learning direction, learning experiences and enactment efforts are translating into meaningful shifts for teachers, classroom practice, and student s’ learning and outcomes. At this stage, review is not about reporting what was completed. It is about interpreting evidence against the school’s intended professional learning logic model, testing whether key assumptions remain valid , and deciding what should inform the next planning cycle. T his includes: using the Theory of Change to make explicit the link between problems of practice, strategies, assumptions, outcomes and impact, u sing the LEARN Compendium to review professional learning at both whole-school and programme levels , analysing evidence across LEARN indicators for Enablers and Outcomes, and using mid-year and year-end findings to decide what should continue, be adjusted, deepened or stopped."}, {"id": "5.1", "part": "p5", "title": "Building a Theory of Change for Professional Learning", "text": "A Theory of Change is a logical account of how and why a set of activities is expected to lead to desired outcomes. In the context of professional learning, it helps schools to make explicit the chain of reasoning — connecting the school’s key problems of practice, to the professional learning strategies, the conditions that need to be in place , and the intended shifts in teacher learning, professional practice, collaborative culture and student outcomes. In this playbook, the Theory of Change helps SSDs and School Management Teams make their professional learning logic visible : What problem of practice is our professional learning efforts trying to address? Why do we believe these professional learning strategies will lead to the intended shifts? What enabling conditions must be in place for the strategies to work? What evidence will help us know whether the logic is valid ? Theory of Change: why it matters The value of a Theory of Change model lies in the discipline it brings to decision-making. It helps SSDs and School Management Teams stay clear about what is worth doing, why it is worth doing, and what must be strengthened when implementation becomes complex. It strengthens the intentionality in professional learning, by ensuring the learning experiences designed has a clear line of sight to the intended shift in teacher practice, professional culture or students’ learning. It strengthens diagnosis during review by helping the school determine whether the limited progress points to the strategy chosen, the way it was enacted, or enabling conditions that were not sufficiently in place. The template below shows the generic structure of a Theory of Change model for professional learning. The Theory of Change model moves from problems of practice that give rise to the Total Learning Plan, through the strategies designed to address them, to the outcomes at the different time horizons, and finally to impact framed against the school’s Vision, Mission and Values. Between each stage, there are assumptions (or enabling conditions) that must hold for the logic to work . The arrow looping back from Outcomes to Key Problems of Practice is deliberate. Mid-year and year-end reviews do more than measure progress – they often surface new tensions or refine existing ones. Implementation gaps, shifting school or system priorities, and emerging student needs may reveal problems of practice that were not visible at the planning stage. When this happens, SSDs bring the evidence back to the School Management Team and work through the process again: re-articulating the problem, examining assumptions, and adjusting strategies accordingly. The Theory of Change is not a static model – it is a thinking discipline that the school returns to as its understanding deepens. A note on assumptions Assumptions are an honest acknowledgement that strategies depend on conditions that must be actively created and maintained. Name them explicitly in the theory of change model. Therefore, when a theory of change fails to produce the expected outcomes, the most productive diagnostic move is often not to re-design the strategy, but to ask which assumption quietly broke down. Building the Theory of Change Model The table below walks through each stage of the model, clarifying what it contains and the key question each stage must answer. Note that assumptions appear at three points in the model — each set is distinct, reflecting the different conditions that must exist at each transition. Use this as a practical guide when constructing the school's theory of change alongside the ToLP. Stage What it cont ains The question it must answer Key Problems of Practice The creative tensions identified in Section 2.3 — articulated as \" We aim to [vision], but currently [reality], resulting in [impact] . \" These gaps the ToLP aims to close are the starting points.. What is the specific problem of practice our PL strategy is responding to? Assumptions (1) The conditions that must hold for your strategies to be implementable should be named explicitly and actively built, and not assumed to already exist. What must be true in our school before our strategies can take effect? Strategies The professional learning strategic initiatives that will form the backbone of the Total Learning Plan, anchored to relevant TGM Learning Areas and SFEd Areas of Practice. What will we do — and how do the learning experiences we design address the problem? Assumptions (2) The conditions that must hold for strategies to produce outcomes rather than just activity (e.g., that reflection is embedded, strategies are coherent and aligned, and Teacher Leaders are equipped to champion the change). What must be true for our strategies to lead to the outcomes we intend, not just participation? Outcomes Changes expected at three time horizons: Short-term (e.g., teacher awareness, ownership, confidence o r readiness ), Medium-term (e.g., application in practice, collaboration, consistency or quality of enactment ), Long-term (e.g., sustained PL culture, reflective practice, improved student outcomes ). What changes do we expect to see, and when? Assumptions (3) The conditions that must hold for outcomes to translate into lasting impact (e.g., leadership sustains commitment, and school structures institutionalise effective practices over time). What must hold for outcomes to become lasting change? Impact The ultimate purpose that is aligned to the school's Vision, Mission, and Values. It is the school's articulation of the students, teachers and community it is working towards. If we succeed, what kind of school — and what kind of people — will we have built? Feedback loop What mid-year and year-end reviews reveal (e.g., what changed, what stalled, and what was not anticipated) feeds directly back into the school's understanding of its problems of practice. New tensions may emerge; existing ones may need to be reframed. What did we learn from this cycle that changes how we understand the problem — and what does that mean for next year's ToLP? ▸ Example — tap to show Example: Theory of Change The diagram below illustrates how one school built its Theory of Change for professional learning — moving from two creative tensions through to impact framed against the school's VMV. Use it as a reference for how the stages connect and how assumptions are named explicitly at each transition. Every school's Theory of Change model will look different, as the problems of practice, strategies, and impact will reflect your context, your staff, and your students. A Theory of Change without evaluation is still only a statement of intent. The LEARN Compendium is what turns intent into evidence — giving SSDs the structured lens to assess, at both whole-school and programme levels, whether the professional learning strategies are producing the outcomes the theory predicted, and where the assumptions may have broken down."}, {"id": "5.2", "part": "p5", "title": "Evaluating PL Impact with the LEARN Compendium", "text": "The LEARN Compendium is a framework for schools to review the effectiveness and impact of their professional learning efforts . It comprises five dimensions , aligned with Guskey (2016) ’s levels of data , and are organised into two Enablers and three Outcomes. The Enablers guide schools in planning, implementing and review of the professional learning efforts , while the Outcomes inform the school s of their progress. Enablers support the achievement of Outcomes, while Outcomes inform on the effectiveness of the Enablers. ENABLERS OUTCOMES Empowering Educators Teacher Ownership: Empowering teachers to take ownership of their own professional growth Nurturing Networks Teacher Leadership: Nurturing communities and connections that enable sharing of good practices and support from knowledgeable others Resonance Teachers' meaningful engagement with PL and its influence on their beliefs and perspectives Learning Teachers’ growth in knowledge and/or skills through PL Adoption Te achers’ translation of learning into sustained change s in professional practices after PL, which in turn supports student-related outcomes LEARN is most powerful when used as a reflective discipline rather than a measurement exercise. The five dimensions each carry a set of Key Review Questions — these are the primary tool. They prompt SSDs to examine the school’s PL, at mid-year and year-end, and to use evidence to answer those questions. The indicators below are a possible suite drawn from the Possible Outcome Measures Document and other possible school data sources (e.g., SSES, QSE, lesson observations, FGDs, staff perception surveys). They are offered to support SSDs in answering the Key Review Questions with credibility and specificity. SSDs should exercise professional judgement in selecting those that are meaningful to their evaluation purpose and contextualised to where the school is in its PL journey. ENABLERS Dimension Description Key Review Questions Performance Indicators (Programme-Level) [E] Empowering Educators Teacher Ownership: Empowering teachers to take ownership of their professional growth How does the school create opportunities for teachers to shape their professional growth in alignment with their interests and needs (e.g., through intentional assignments, support for teacher-initiated learning, incorporating teacher voice in school-wide PL)? How does the school provide the necessary conditions for teachers to engage effectively in PL (e.g., protected time, workload support, funding)? No. of school-wide PL that incorporates opportunities for teacher agency, e.g. choice of topics, segments or modes of learning Post-PL program me evaluation survey, e.g. “The PL programme reflected my choices in what/how to learn” [N] Nurturing Networks Teacher Leadership: Nurturing communities and connections that enable sharing of good practices and support from knowledgeable others How does the school create opportunities for teachers to collaborate and share good practices? How does the school connect teachers with knowledgeable others to support their professional learning? No. of professional collaborative/sharing sessions conducted within school (e.g., Learning Day, open classrooms) and beyond school (e.g., TLWs, conferences, cluster/ zonal/ national sharing) % of teachers involved in mentoring or coaching others within/beyond school OUTCOMES [R] Resonance Teachers' meaningful engagement with PL and its influence on their beliefs and perspectives To what extent do teachers find PL meaningful and relevant to their professional context and needs? To what extent has PL strengthened teachers' beliefs and perspectives about their professional practice? Post-PL program me evaluation survey, e.g. “ The PL was relevant and applicable to my current work” “I am more confident in implementing Differentiated Instruction in my classroom” [L] Learning Teachers’ growth in knowledge and/or skills through PL To what extent have teachers acquired or deepened their knowledge and/or skills through PL? Pre- and post- PL diagnostic survey to assess learning through PL Artefacts of learning from PLTs or school/department-wide PL (e.g., lesson plans) [A] Adoption Teachers’ translation of learning into changed professional practices after PL, which in turn supports student-related outcomes To what extent have teachers translated their learning into changes in professional practice , and how sustained are these changes over time ? To what extent have these changes in professional practice contributed to improved student outcomes? No. of lesson plans developed by PLTs / during department or school-wide PL that were enacted Staff perception survey , e.g. “I have applied learning from PL (internal/external) in my classroom” Design and Review as one discipline: Design Principle for Effective PL and the LEARN Compendium The Design Principles guide how SSDs design professional learning, whereas the LEARN Compendium helps SSDs find out whether that design has been effective in achieving intended outcomes. The guiding questions in each LEARN dimension are not generic evaluation prompts — instead, they are a direct examination of the design decisions made earlier in the cycle . For example: If teachers do not show Adoption , the issue may not be that they need another workshop. The school may need to strengthen Nurturing Networks (e.g., mentoring, PLT debriefs, open classrooms, or access to knowledgeable others). If Resonance is weak, teachers may not see how the professional learning experience connect to their professional context, needs or beliefs about practice. The issue may lie in how well the professional learning design reflects Empowering Educators (e.g., teacher voice, choice, ownership and enabling conditions). If Learning remains shallow despite strong participation, the design may need stronger evidence, expertise, modelling or practice opportunities, so that teachers acquire and deepen the intended knowledge and skills. SSDs who review through this lens are not merely reporting whether professional learning took place. They are diagnosing whether the professional learning design created the right conditions, whether teachers experienced meaningful learning, and whether that learning is translating into sustained changes in professional practice. What is learned from each review cycle should directly sharpen the next Total Learning Plan. ▸ Example — tap to show Example: Applying LEARN through the Review Cycle The scenario below follows an SSD through a mid-year and year-end LEARN review for the same Total Learning Plan initiative (i.e., a whole-school shift to inquiry-based, student-centred learning). At each review point, the SSD begins with relevant key review question(s) from the LEARN Compendium, draws on available school evidence , and makes a specific, justified decision. The mid-year review diagnoses and sharpens what is already in motion, while the year-end review consolidates what the evidence confirms or challenges, and feeds those insights into the next school strategic planning cycle and Total Learning Plan. Mid-Year Review in Term 2 At mid-year, the SSD first examines whether the Enablers for professional learning are sufficiently in place, before reading early signals across the Outcomes of Resonance, Learning, and Adoption. ENABLERS Dimension Key Review Question Evidence Interpretation and Action E How does the school create opportunities for teachers to shape their professional growth in alignment with their interests and needs? Staff perception survey: 62% reported having choice in their PLT inquiry focus. Despite the SSD-led pre-workshop consultation with all staff, 70% felt the whole-school IBL workshop was designed for them rather than with them. The consultation process did not translate into felt ownership. To close this gap, teachers would pre-select their own inquiry track for the Term 3 workshop two months in advance. The session would be built around their choices, with teacher-led sharing structured into the design. N How does the school create opportunities for teachers to collaborate and share good practices? PLCDR survey: CLA: Implementing SPP: Initiating Peer observation was active across 15 pairs, but post-lesson debriefs were often being shortened or skipped due to time constraints. No cross-department PLT activity had taken place. The infrastructure for collaboration existed but the mechanism for learning from collaboration could be strengthened. The CIM would run a 90-minute debrief skills session for all PLT facilitators in Term 3, using the 3A reflection protocol as the shared structure. The SSD would work with HODs to consider cross-department PLT pilot anchored on a shared inquiry focus. OUTCOMES Dimension Key Review Question Evidence Interpretation and Action R To what extent do teachers find PL meaningful and relevant to their professional context and needs? PLT attendance: 94%. Post-programme survey: 71% rated PL as meaningful. School-level relevance: 78% agreed PL connected to school strategic goals. Programme-level relevance: 54% for the Term 1 workshop. The lowest-scoring item was: “This connects to what my students specifically need right now.” Teachers understood the school rationale, but could not yet see the classroom and subject-specific rationale clearly. The SSD would work with HODs and department TLs to co-design subject-specific application guides, establishing co-ownership. Every Term 3 PLT session would also open with one piece of student artefact before pedagogical discussion began. L To what extent have teachers acquired new knowledge and/or skills through PL? Post-workshop reflections showed that teachers could describe the broad intent of IBL and identify at least one IBL strategy. FGD with HODs surfaced a different picture: teachers were attending but not engaging deeply with what quality IBL should look like in their subject contexts. Teachers had acquired the broad concept, but had not yet developed the practical confidence and professional judgement needed for enactment. A pre-lesson planning protocol would be added to PLT cycles, so that teachers could plan, anticipate student responses and clarify what quality IBL enactment would look like before trying it in class. A To what extent have teachers translated their learning into changes in professional practice? Open classroom insights : 31% showed student-directed inquiry, against the Term 3 target of 50%. QSE Academic Self-efficacy: 63%, against a national average of 76%. Early student artefacts suggested that most tasks still required students to follow prescribed steps rather than generate questions or make decisions. Adoption was emerging but not yet consistent. Each teacher would plan, teach and debrief one IBL lesson with a peer observer within the same fortnight. The SSD would work with the CIM to identify less confident teachers and offer the option of IM-supported co-planning before Term 3. Mid-year insight: The review showed that the SSD’s strongest leverage was in strengthening programme enablers (e.g., HOD ownership, protected debrief time, student-evidence anchors and feedback loops). These mechanisms enabled learning to take hold but had been underweighted at planning. Future initiatives would need such conditions built in from the start. Year -End Review in Term 4 At year-end, the SSD examines whether the refined supports strengthened the enablers for PL, and whether there is sufficient evidence of resonance, learning and adoption to inform the next school strategic planning cycle. ENABLERS Dimension Key Review Question Evidence Interpretation and Action E How does the school create opportunities for teachers to shape their professional growth in alignment with their interests and needs? 74% reported having genuine choice in their PLT inquiry focus, up from 62% at mid-year. The redesigned Term 3 workshop was rated as more responsive to teachers’ needs. Experienced teachers reported that PLT sessions gave them more space to contribute their classroom experience, rather than simply receive new strategies. Teacher choice and structured contribution made a felt difference. In the next cycle, the pre-selection mechanism (i.e., embed agency in choice) and teacher-led sharing segments would be documented as design considerations for future whole-school PL. N How does the school create opportunities for teachers to collaborate and share good practices? Cross-department PLT activity began between two departments. Professional sharing sessions within school increased from the Term 1 baseline. One teacher pair submitted a sharing proposal to the cluster network. . Collaborative culture had moved from structure to emerging norm. Cross-department PLTs would expand in Year 2. To review PLCDR next year, as an annual staff practice , so that to track progress towards building a collaborative learning culture. OUTCOMES R To what extent do teachers find PL meaningful and relevant to their professional context and needs? Programme-level relevance scores improved to 73%, up from 54% in Term 1. FGD with teachers surfaced that PLT was most useful when it started with student artefacts or student voice rather than with an abstract framework. The student evidence anchor shifted how teachers understood the purpose of PL. In Year 2, every PLT cycle would open with student evidence or student voice, written into the PLT facilitator brief as a standing expectation. L To what extent have teachers acquired new knowledge and/or skills through PL? Teachers articulated clearer distinctions between activity-based lessons and genuine inquiry. Teacher reflections showed more specific attention to questioning, student decision-making and facilitation moves. Learning deepened when teachers had concrete examples, peer discussion, student evidence and structured feedback. In the next cycle, HODs and TLs would be involved earlier as co-designers so that PL design begins from subject-specific practice. A To what extent have teachers translated their learning into changes in professional practice? Open classroom insights: 47% showed student-directed inquiry, close to the 50% target. Student FGDs included more references to lessons where they had to figure things out, ask questions and make decisions. Peer observation records showed that teachers were refining IBL lessons across more than one cycle, rather than trying the strategy once. Adoption was visible and beginning to sustain. In Year 2, the school would shift from increasing the frequency of IBL to deepening the quality of enactment. Findings would be presented to School Leaders as evidence that the initiative had reached students, not just teachers. Year-end insight: The evidence confirmed that the mid-year adjustments were key to mechanisms of change. The school ended the year close to its targets, with a clearer understanding of what enabled PL to take hold. This would inform the next cycle’s Total Learning Plan. Feeding Review back into the Planning Cycle The year-end review should not remain as a retrospective report on professional learning activities. At the school level, evaluation findings should feed into the next planning cycle, where School Leaders and the School Management Team agree on the areas of focus for the following year’s School Improvement Plan. For SSDs, this means synthesising the evidence based on the LEARN Compendium and reviewing the Theory of Change model to sharpen its implications on school planning: Which professional learning priorities should be continued, deepened or stopped? Which enabling conditions need to be strengthened for PL to have greater impact? Which new or refined problems of practice should inform the next cycle? What do department-level findings suggest about whole-school direction? How should the next Total Learning Plan support the school’s emerging priorities? The SSD’s role is not only to evaluate whether PL worked, but to help the school use that evidence to make sharper decisions about staff development, school improvement and
